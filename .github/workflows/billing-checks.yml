name: Billing checks
on:
  pull_request:
    paths:
      - 'billing/**'
      - 'supabase/**'
      - '.github/workflows/billing-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Ubuntu 26.04 build; ubuntu-latest moved there in Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ledger and import unit tests
        run: node --test billing/tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          for file in billing/*.js; do node --check "$file"; done
      - run: npx playwright install --with-deps chromium webkit
      - name: Billing browser tests
        run: npx playwright test --config=billing/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-test-results
          path: |
            billing-report
            billing-results
          retention-days: 14
  database:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Ubuntu 26.04 build; ubuntu-latest moved there in Oct 2026
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: billing_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: billing_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disposable database fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -f billing/tests/sql-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/app-tables.sql
      - name: Apply billing migration
        run: psql -v ON_ERROR_STOP=1 -f billing/migrations/20261104_billing_cloud.sql
      - name: Apply history migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_keep_history.sql
      - name: Apply private song text migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_song_text_cloud_sync.sql
      - name: Apply account-scoped song text tombstone migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_song_text_tombstones.sql
      - name: Apply paid STT quota migrations (test limits, raised limits, then no limit + usage)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261106_vzip_song_stt_quota.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261107_vzip_song_stt_quota_raise.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108_vzip_song_stt_no_limit_usage.sql
      - name: Paid STT calls counted without a limit; per-account usage
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stt-quota.sql
      - name: Song reference and STT RLS, per-user cross-device reads
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/song-text-cloud.sql
      - name: RLS, RPC privileges and optimistic revisions
        run: psql -v ON_ERROR_STOP=1 -f billing/tests/cloud.sql
      - name: Concurrent cloud writes
        run: node billing/tests/concurrency.cjs
      - name: History keeps every version, deletions included, read-only and per account
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/history.sql
