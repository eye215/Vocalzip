name: UI browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: node tests/make-audio-fixtures.cjs
      - run: node --test tests/chunk-media.test.cjs tests/media-date.test.cjs tests/bounded-byte-writer.test.cjs tests/data-merge.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=chromium-desktop --workers=1 --grep 'Video import copies|201MiB video extraction|Real queue extracts|Metadata-derived dates'
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
