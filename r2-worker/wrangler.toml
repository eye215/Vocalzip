# Cloudflare Worker for VOCAL.zip media (R2). See docs/R2_설정_가이드.md.
name = "vocalzip-media"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vocalzip-media"

[vars]
SUPABASE_URL = "https://chxnbtiyuyhiywzeshis.supabase.co"
ALLOWED_ORIGINS = "https://vocalzip.yullul.com,https://eye215.github.io"
# MAX_FILE_BYTES = "2147483648"

# Secrets are NOT written here. Set them once with:
#   npx wrangler secret put SIGNING_SECRET
#   npx wrangler secret put SUPABASE_JWT_SECRET   (only if the project still uses the legacy JWT secret)

# Cloudflare Media Transformations beta; not the R2 bucket binding above.
# Requires Cloudflare account-level Media Transformations support.
# The MEDIA_TRANSFORM binding has been added in the Cloudflare Production dashboard.
# Mirror it here so future wrangler deployments preserve the same binding.
# This binding alone does NOT activate extraction. The Worker additionally requires
# STT_CLIP_ENABLED=true and STT_CLIP_ALLOWED_USER_IDS with an exact user UUID.
# Keep STT_CLIP_ENABLED unset/false until a disposable audio-only M4A clip is verified.
[media]
binding = "MEDIA_TRANSFORM"
