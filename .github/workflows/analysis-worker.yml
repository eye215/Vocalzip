# VOCAL.zip server analysis worker: analyzes new recordings and suggests song candidates (lyrics recognition), even
# when the app is closed. Free on GitHub-hosted runners for this public repository.
# Needs repository secrets (Settings → Secrets and variables → Actions); without SUPABASE_DB_URL it does nothing:
#   SUPABASE_DB_URL        Supabase → Connect → Session pooler URI (IPv4), with the database password
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   Cloudflare R2 API token, Object Read only
#   OPENAI_API_KEY         optional: automatic lyrics recognition (STT) for song recordings without a song, within the
#                          owner-approved monthly cap for all accounts together (vzip_auto_stt_budget, $2.00; needs
#                          supabase/migrations/20261115_auto_stt_budget.sql). Without the key or the migration no paid
#                          call is made: saved transcripts are still reused. Candidates always wait for the user's approval.
#   SUPABASE_SERVICE_ROLE_KEY   optional: older recordings still kept in Supabase Storage
# Logs show counts only (this repository is public).
name: Analysis worker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'How many jobs at most (1 = single-file check)'
        default: ''
      kinds:
        description: 'vocal, song or both (empty = both)'
        default: ''
      verbose:
        description: 'Log each step (sizes and statuses only)'
        type: boolean
        default: false
      requeue_network_failures:
        description: 'Queue again the jobs that failed only because the file could not be reached'
        type: boolean
        default: false
      reanalyze_old_vocal:
        description: 'Re-analyse every recording whose saved analysis is older than the current analyzer (keeps the old one in history)'
        type: boolean
        default: false
      requeue_stt_requests:
        description: 'Queue again song jobs that waited for an app STT request (automatic STT then applies, within the monthly cap)'
        type: boolean
        default: false
      reanalyze_unreliable:
        description: 'Preview current held-back, readable recordings only; skips normal processing in this run'
        type: boolean
        default: false
      reanalyze_apply:
        description: 'OWNER APPROVAL REQUIRED: enqueue the previewed candidates (default is read-only)'
        type: boolean
        default: false
      reanalyze_limit:
        description: 'Maximum held-back recordings to preview/enqueue (1–500); normal queue runs later'
        default: '50'
  repository_dispatch:
    types: [analyze]
permissions:
  contents: read
  actions: write # only to start the next run of this workflow while recordings are still waiting
concurrency:
  group: analysis-worker
  cancel-in-progress: false
jobs:
  work:
    if: github.repository == 'eye215/Vocalzip'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Anything waiting?
        if: ${{ !inputs.reanalyze_unreliable }}
        id: peek
        run: node worker/analysis-worker.mjs --peek
      - name: Preview or enqueue held-back recordings
        if: inputs.reanalyze_unreliable
        env:
          WORKER_REANALYZE_APPLY: ${{ inputs.reanalyze_apply && '1' || '' }}
          WORKER_REANALYZE_LIMIT: ${{ inputs.reanalyze_limit }}
        run: node worker/analysis-worker.mjs --reanalyze-unreliable
      # A pinned prebuilt ffmpeg (npm ffmpeg-static), cached between runs: apt mirrors once took 38 minutes.
      - name: Cache ffmpeg
        if: ${{ !inputs.reanalyze_unreliable && ((steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures || inputs.requeue_stt_requests || inputs.reanalyze_old_vocal) }}
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-5.2.0-${{ runner.os }}
      - name: Install ffmpeg
        if: ${{ !inputs.reanalyze_unreliable && ((steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures || inputs.requeue_stt_requests || inputs.reanalyze_old_vocal) }}
        timeout-minutes: 8
        run: |
          if [ ! -x ~/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg ]; then
            npm install --prefix ~/ffmpeg-static --no-save --no-audit --no-fund ffmpeg-static@5.2.0 || true
          fi
          if [ -x ~/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg ]; then
            echo "FFMPEG_PATH=$HOME/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
          else
            command -v ffmpeg || timeout 300 sudo apt-get install -y -q --no-install-recommends ffmpeg
          fi
      - name: Analyze
        id: analyze
        if: ${{ !inputs.reanalyze_unreliable && ((steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures || inputs.requeue_stt_requests || inputs.reanalyze_old_vocal) }}
        timeout-minutes: 48
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_MAX_JOBS: ${{ inputs.max_jobs }}
          WORKER_KINDS: ${{ inputs.kinds }}
          WORKER_VERBOSE: ${{ inputs.verbose && '1' || '' }}
          WORKER_REQUEUE_NETWORK: ${{ inputs.requeue_network_failures && '1' || '' }}
          WORKER_REQUEUE_STT: ${{ inputs.requeue_stt_requests && '1' || '' }}
          WORKER_REANALYZE_OLD: ${{ inputs.reanalyze_old_vocal && '1' || '' }}
        run: node worker/analysis-worker.mjs
      # GitHub's 10-minute schedule can lag for hours. A run that got through recordings (and did not stop on repeated
      # failures) starts the next run itself while more are waiting; single-file checks (max_jobs) never chain.
      - name: Continue while recordings wait
        if: ${{ !inputs.reanalyze_unreliable && success() && steps.analyze.outputs.processed != '' && steps.analyze.outputs.processed != '0' && steps.analyze.outputs.stopped != 'true' && inputs.max_jobs == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(GITHUB_OUTPUT=/dev/null node worker/analysis-worker.mjs --peek | sed -n 's/.*: \([0-9]*\) job(s) waiting.*/\1/p')
          echo "waiting after this run: ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then gh workflow run analysis-worker.yml --ref "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" && echo "started the next run"; fi
