name: Verify deployed upload release
on:
  push:
    branches: ['codex/verify-upload-release-20261108']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare public deployed scripts with checkout
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const paths=['index.html','legacy.html','media-naming.js','r2-storage.js','app/media.js','app/core.js','app/views-main.js','cloud-sync.js','app/views-more.js'];
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const results=await Promise.all(paths.map(async path=>{
            const local=await readFile(path);
            const response=await fetch('https://vocalzip.yullul.com/'+path+'?verify='+process.env.GITHUB_SHA,{redirect:'error',signal:AbortSignal.timeout(15000)});
            const remote=Buffer.from(await response.arrayBuffer());
            return {path,status:response.status,sha256_match:response.ok&&hash(local)===hash(remote)};
          }));
          for(const result of results)console.log(JSON.stringify(result));
          if(results.some(result=>!result.sha256_match))process.exitCode=1;
          NODE
