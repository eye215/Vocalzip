name: Calendar dashboard checks
on:
  pull_request:
    paths:
      - 'app/calendar-summary.*'
      - 'app/views-lessons.js'
      - 'tests/calendar-summary*'
      - '.github/workflows/calendar-checks.yml'
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/calendar-summary.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/calendar-summary.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-dashboard-results
          path: |
            playwright-report/
            test-results/
