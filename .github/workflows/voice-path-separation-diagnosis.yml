name: Voice path read-only separation observation
on:
  pull_request:
    paths: ['worker/voice-path-separation-diagnosis.mjs', 'tests/voice-path-separation-diagnosis.test.cjs', '.github/workflows/voice-path-separation-diagnosis.yml']
  workflow_dispatch:
    inputs:
      recording_bytes:
        description: 'Exact source byte count from diagnosis'
        required: true
        type: string
      recording_month:
        description: 'Recording month YYYY-MM from diagnosis'
        required: true
        type: string
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: node --test tests/mr-runtime-diagnosis.test.cjs tests/voice-path-separation-diagnosis.test.cjs
  observe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'eye215/Vocalzip' && github.ref == 'refs/heads/main'
    needs: synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-5.2.0-${{ runner.os }}
      - name: Reuse existing ffmpeg binary
        timeout-minutes: 8
        run: |
          if [ ! -x ~/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg ]; then
            npm install --prefix ~/ffmpeg-static --no-save --no-audit --no-fund ffmpeg-static@5.2.0
          fi
          echo "FFMPEG_PATH=$HOME/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
          key: demucs-4.0.1-torch-2.3.1-cpu-${{ runner.os }}
      - name: Install existing pinned separator
        timeout-minutes: 15
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.3.1 torchaudio==2.3.1
          python -m pip install --quiet demucs==4.0.1 soundfile
      - name: Observe exact source without saving measurements
        timeout-minutes: 21
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RECORDING_BYTES: ${{ inputs.recording_bytes }}
          RECORDING_MONTH: ${{ inputs.recording_month }}
        run: node worker/voice-path-separation-diagnosis.mjs
