name: Verify published recording safety
on:
  push:
    branches:
      - 'codex/verify-recording-release-07b6ddb841b9'
permissions:
  contents: read
jobs:
  public-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare public recording, home and score assets with release
        run: python3 tools/verify-published-recording.py
