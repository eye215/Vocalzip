name: UI browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    env:
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/collection-routes.test.cjs
      - name: Provide FFmpeg and FFprobe for media fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout 180 npm install --prefix "$RUNNER_TEMP/ffmpeg-bin" --no-save --no-audit --no-fund ffmpeg-static@5.2.0 ffprobe-static@3.1.0
            ln -s "$(node -p "require('$RUNNER_TEMP/ffmpeg-bin/node_modules/ffmpeg-static')")" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
            ln -s "$(node -p "require('$RUNNER_TEMP/ffmpeg-bin/node_modules/ffprobe-static').path")" "$RUNNER_TEMP/ffmpeg-bin/ffprobe"
            echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
          fi
      - run: node tests/make-audio-fixtures.cjs
      - run: node --test tests/repertoire-model.test.cjs tests/chunk-media.test.cjs tests/media-date.test.cjs tests/bounded-byte-writer.test.cjs tests/data-merge.test.cjs tests/media-delete.test.cjs tests/flac-encode.test.cjs tests/vocal-analysis.test.cjs
      - run: npx playwright test tests/v6.spec.cjs --project=chromium-mobile --grep 'Settings' --workers=1
      - run: npx playwright test tests/repertoire.spec.cjs --workers=2
      - run: npx playwright test --project=chromium-desktop --workers=1 --grep 'Video import copies|201MiB video extraction|Real queue extracts|Metadata-derived dates'
      - name: Pinned PDF renderer/export libraries for full score regression
        run: npm install --prefix /tmp/vzip-score-pdfjs --ignore-scripts --omit=optional pdfjs-dist@4.10.38 pdf-lib@1.17.1
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

