name: Release duplicate metadata bridge check slots
on:
  push:
    branches: ['verify/media-edit-bridge-ci-20261110']
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            for(const run_id of [42820429955,42820430221]){
              const {data:r}=await github.rest.actions.getWorkflowRun({owner,repo,run_id});
              if(r.head_branch!=='codex/media-metadata-bridge-20261110'||r.event!=='push'||r.head_sha!=='b83c66919f24376979bdc6e8d840faef822a7178'||r.status==='completed')continue;
              try{await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{owner,repo,run_id});}
              catch(error){if(![404,409,422].includes(error.status))throw error;}
            }
            console.log('Only duplicate push runs of the metadata bridge branch were stopped; PR checks retained.');
