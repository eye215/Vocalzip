name: Precision reports
on:
  pull_request:
    paths: ['app/precision-report*', 'app/precision-analysis.js', 'app/audio-file-loader.js', 'app/precision-result-store.js', 'supabase/functions/vzip-precision-coach/**', 'tests/precision-report*', 'tests/precision-long-input*', 'tests/precision-coach*', 'tests/precision-integration*', 'tests/precision.playwright.config.cjs', 'tests/growth-characterization.spec.cjs', '.github/workflows/precision-reports.yml']
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/precision-report.test.cjs tests/precision-long-input.test.cjs tests/precision-coach.test.mjs tests/precision-integration.test.cjs
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=tests/precision.playwright.config.cjs --project=${{ matrix.browser }}-mobile
      - name: Existing growth values and report archive routes
        run: npx playwright test tests/growth-characterization.spec.cjs tests/growth-tabs.spec.cjs tests/growth-unify.spec.cjs --project=${{ matrix.browser }}-mobile --workers=1
      - name: Saved lab report still opens its selected recordings
        run: npx playwright test tests/v6.spec.cjs --grep 'Vocal lab stays a standalone screen' --project=${{ matrix.browser }}-mobile --workers=1
