name: WebKit independent diagnosis
on:
  push:
    branches: [codex/fix-webkit]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --prefix /tmp/vzip-score-pdfjs --ignore-scripts --omit=optional pdfjs-dist@4.10.38 pdf-lib@1.17.1
      - run: npx playwright test tests/cache-context-diagnostic.spec.cjs --project=webkit-mobile --workers=1 --reporter=list
      - run: npx playwright test tests/v6.spec.cjs --grep 'Song sheet keeps aliases' --project=webkit-mobile --workers=1 --repeat-each=30 --reporter=list
