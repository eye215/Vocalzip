name: Verify baseline calendar playback refresh race
on:
  push:
    branches: ['codex/resumable-date-regression-20261108']
permissions:
  contents: read
concurrency:
  group: legacy-date-diagnostic
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/ui.spec.cjs --grep 'Calendar playback waits' --workers=2 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legacy-date-failures
          path: test-results/
