name: Precision reports
on:
  pull_request:
    paths: ['app/precision-report*', 'app/precision-analysis.js', 'app/precision-result-store.js', 'supabase/functions/vzip-precision-coach/**', 'tests/precision-report*', 'tests/precision-coach*', 'tests/precision-integration*', 'tests/precision.playwright.config.cjs', '.github/workflows/precision-reports.yml']
  workflow_dispatch:
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/precision-report.test.cjs tests/precision-coach.test.mjs tests/precision-integration.test.cjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=tests/precision.playwright.config.cjs --project=chromium-mobile
