.dock{position:fixed;z-index:10;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),528px);height:70px;padding:8px;border-radius:99px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.68);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 5px 20px #3721550b}.dock a{text-decoration:none;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7D748A;font-size:11px}.dock a i{font-size:22px;color:var(--body)}.dock a.active{background:#EDE1FF;color:#8A6DB8}.dock a.active i{color:var(--purple)}.record{position:fixed;z-index:11;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 82px);width:52px;height:52px;display:grid;place-items:center;border:0;border-radius:50%;background:linear-gradient(135deg,#9557FF,#7A32F5 52%,#6D2BE5);color:white;box-shadow:0 5px 14px #6d2be52e}.record i{font-size:22px}

</style></head><body><main>
<header class="header"><h1>일정</h1><div class="header-actions"><button class="icon-btn" aria-label="일정 목록"><i class="ph ph-list-bullets"></i></button><button class="icon-btn" aria-label="설정"><i class="ph ph-gear-six"></i></button></div></header>
<section class="summary" aria-label="월간 연습"><div class="summary-head"><div class="summary-title"><strong id="summary-month">11월 연습</strong><details class="summary-help"><summary aria-label="집계 기준">ⓘ</summary><p>연습 기록 1건 또는 연결되지 않은 녹음 1개를 1회로 계산해요. 연결된 녹음은 중복 집계하지 않고, 레슨 녹음과 발성 훈련은 제외해요.</p></details></div><b id="summary-total">42분 · 2회</b></div><button class="ticker" id="ticker" aria-label="연습곡 순위 펼치기, 좌우로 넘겨 기준 전환" aria-expanded="false" aria-controls="rank-panel"><span class="rank" id="rank">시간별 1위</span><span class="song" id="song">Defying Gravity</span><span class="metric" id="metric">24분</span><i class="ph ph-caret-down" aria-hidden="true"></i></button><div class="rank-panel" id="rank-panel" aria-hidden="true" inert><div class="rank-inner"><div class="rank-list" id="rank-list"></div></div></div></section>
<section class="calendar" aria-label="월간 달력"><div class="month-head"><button class="month-btn" id="prev" aria-label="이전 달"><i class="ph ph-caret-left"></i></button><strong id="month-title"></strong><button class="month-btn" id="next" aria-label="다음 달"><i class="ph ph-caret-right"></i></button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="dates" id="dates"></div><div class="legend"><span><em></em>공연·오디션</span><span class="lesson"><em></em>레슨</span><span class="practice"><em></em>연습</span><button class="today-btn" id="today">오늘</button></div></section>
<section aria-label="선택한 날짜의 일정"><div class="date-head"><h2 id="date-title"></h2><button id="add" aria-label="선택한 날짜에 일정 추가"><i class="ph ph-plus"></i></button></div><div id="agenda"></div></section>
</main><button class="record" aria-label="녹음 시작" onclick="location.href='../index.html#/record'"><i class="ph ph-microphone"></i></button><nav class="dock" aria-label="주요 메뉴"><a href="../index.html#/home"><i class="ph ph-house"></i>홈</a><a href="../index.html#/songs"><i class="ph ph-music-notes"></i>내 곡</a><a href="../index.html#/library"><i class="ph ph-archive-box"></i>보관함</a><a href="../index.html#/calendar" class="active" aria-current="page"><i class="ph ph-calendar-blank"></i>일정</a></nav>
<script>
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,localToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(+p.year,+p.month-1,+p.day)};
let selected=localToday(),month=new Date(selected.getFullYear(),selected.getMonth(),1);const demoDate='2026-11-09';const entries=[{kind:'stage',date:demoDate,title:'14:00  뮤지컬 오디션',sub:'위키드 · 공연장',icon:'ticket'},{kind:'lesson',date:demoDate,title:'19:00–20:00  보컬 레슨',sub:'보컬스튜디오 · Defying Gravity · 피드백 미작성',icon:'notebook'},{kind:'practice',date:demoDate,title:'Defying Gravity',sub:'24분',icon:'timer'}];const kinds=[['stage','공연·오디션'],['lesson','레슨'],['practice','연습']];const $=id=>document.getElementById(id);
function draw(){const today=key(localToday());$('month-title').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;$('summary-month').textContent=`${month.getMonth()+1}월 연습`;const sampleMonth=month.getFullYear()===2026&&month.getMonth()===10;$('summary-total').textContent=sampleMonth?'42분 · 2회':'0분 · 0회';$('ticker').hidden=!sampleMonth;if(!sampleMonth)closeRanks();$('dates').replaceChildren();const start=new Date(month);start.setDate(1-start.getDay());const last=new Date(month.getFullYear(),month.getMonth()+1,0);const count=Math.ceil((month.getDay()+last.getDate())/7)*7;for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.className='day'+(d.getMonth()===month.getMonth()?'':' outside')+(key(d)===key(selected)?' selected':'')+(key(d)===today?' today':'');b.textContent=d.getDate();b.setAttribute('aria-label',`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`);if(key(d)===today)b.setAttribute('aria-current','date');if(entries.some(e=>e.date===key(d)))b.dataset.dots='true';b.onclick=()=>{selected=d;month=new Date(d.getFullYear(),d.getMonth(),1);draw()};$('dates').append(b)}$('date-title').textContent=`${selected.getMonth()+1}월 ${selected.getDate()}일 (${['일','월','화','수','목','금','토'][selected.getDay()]})`;const agenda=$('agenda');agenda.replaceChildren();let any=false;for(const [kind,label] of kinds){const rows=entries.filter(e=>e.kind===kind&&e.date===key(selected));if(!rows.length)continue;any=true;const section=document.createElement('section');section.className=`group ${kind}`;const bar=document.createElement('div');bar.className='group-label';bar.textContent=label;section.append(bar);const list=document.createElement('div');list.className='items';for(const e of rows){const a=document.createElement('a');a.className='item';a.href='../index.html#/calendar';a.innerHTML=`<span class="avatar"><i class="ph ph-${e.icon}"></i></span><span class="item-text"><strong></strong><small></small></span><i class="ph ph-caret-right" aria-hidden="true"></i>`;a.querySelector('strong').textContent=e.title;a.querySelector('small').textContent=e.sub;list.append(a)}section.append(list);agenda.append(section)}if(!any){const p=document.createElement('p');p.className='empty';p.textContent='이 날 등록된 일정과 연습 기록이 없어요.';agenda.append(p)}}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);selected=new Date(month);draw()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);selected=new Date(month);draw()};$('today').onclick=()=>{selected=localToday();month=new Date(selected.getFullYear(),selected.getMonth(),1);draw()};$('add').onclick=()=>{location.href='../index.html#/calendar'};
const scores={시간:[['Defying Gravity','24분'],['지금 이 순간','12분'],['Popular','6분'],['For Good','5분'],['On My Own','3분']],횟수:[['Defying Gravity','2회'],['Popular','1회'],['지금 이 순간','1회'],['For Good','1회'],['On My Own','1회']]};const bothValues=title=>`${scores.시간.find(x=>x[0]===title)?.[1]||'0분'} · ${scores.횟수.find(x=>x[0]===title)?.[1]||'0회'}`;let type='시간',position=0,opened=false;function rank(){const [song]=scores[type][position];$('rank').textContent=`${type}별 ${position+1}위`;$('song').textContent=song;$('metric').textContent=bothValues(song);const list=$('rank-list');list.replaceChildren();scores[type].forEach(([title],i)=>{const row=document.createElement('button');row.type='button';row.className='rank-row'+(i===position?' active':'');const values=bothValues(title);row.setAttribute('aria-label',`${type}별 ${i+1}위 ${title}, ${values}`);row.innerHTML='<span class="rank-number"></span><span class="song"></span><span class="metric"></span>';row.querySelector('.rank-number').textContent=`${type}별 ${i+1}위`;row.querySelector('.song').textContent=title;row.querySelector('.metric').textContent=values;row.onclick=()=>{if(swiped)return;position=i;rank();closeRanks();$('ticker').focus()};list.append(row)})}function closeRanks(){opened=false;$('rank-panel').classList.remove('open');$('rank-panel').setAttribute('aria-hidden','true');$('rank-panel').inert=true;$('ticker').setAttribute('aria-expanded','false');$('ticker').setAttribute('aria-label','연습곡 순위 펼치기, 좌우로 넘겨 기준 전환')}function toggleRanks(){opened=!opened;$('rank-panel').classList.toggle('open',opened);$('rank-panel').setAttribute('aria-hidden',String(!opened));$('rank-panel').inert=!opened;$('ticker').setAttribute('aria-expanded',String(opened));$('ticker').setAttribute('aria-label',opened?'연습곡 순위 접기, 좌우로 넘겨 기준 전환':'연습곡 순위 펼치기, 좌우로 넘겨 기준 전환');if(!opened)$('ticker').blur()}function setRankType(next){if(type===next)return;type=next;position=0;rank()}function advanceRank(){if(position<scores[type].length-1)position++;else{type=type==='시간'?'횟수':'시간';position=0}rank()}let touchX=0,touchY=0,swiped=false;$('ticker').onclick=()=>{if(swiped){swiped=false;return}toggleRanks()};for(const target of [$('ticker'),$('rank-panel')]){target.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;swiped=false},{passive:true});target.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){swiped=true;setRankType(dx>0?'시간':'횟수');setTimeout(()=>swiped=false,500)}},{passive:true})}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&opened){closeRanks();$('ticker').focus()}});document.addEventListener('click',e=>{if(opened&&!e.target.closest('.summary'))closeRanks()});setInterval(()=>{if(opened||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;advanceRank()},3500);rank();draw();
</script></body></html>
