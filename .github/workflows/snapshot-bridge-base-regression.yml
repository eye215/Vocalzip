name: Snapshot bridge baseline regression
on:
  push:
    branches: ['codex/snapshot-bridge-base-regression-20261110']
permissions:
  contents: read
jobs:
  unchanged-main-r2-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '04c9695633e3f643668f1556a3f53d6581aa660b'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Existing main import chooser without new snapshot changes
        run: npx playwright test tests/r2.spec.cjs --grep 'With R2 set up' --workers=3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-main-r2-picker
          path: |
            test-results/
            playwright-report/
