name: Recording safety checks
on:
  pull_request:
    paths:
      - 'app/views-main.js'
      - 'app/media.js'
      - 'tests/v6.spec.cjs'
      - 'app/bt-route-test.js'
      - 'app/bt-route-test.css'
      - 'tests/bt-route-test.spec.cjs'
      - '.github/workflows/recording-safety-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording:
    runs-on: ubuntu-24.04
    timeout-minutes: 35  # the apt step of the browser install alone sometimes takes 15+ minutes on a busy runner
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - name: Recorder IDs, failure retry, original preservation and lesson links
        run: npx playwright test tests/v6.spec.cjs --grep 'One-touch recording|New recording after save|Lesson recording retry|Recording from a lesson|Denied microphone' --workers=2
      - name: Bluetooth route test screen (stubbed microphone and audio session)
        run: npx playwright test tests/bt-route-test.spec.cjs --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-safety-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
