name: Precision measurement
on:
  pull_request:
    paths: ['app/precision-session*', 'tests/precision-session*', 'tests/growth-characterization.spec.cjs', '.github/workflows/precision-measurement.yml']
  workflow_dispatch:
jobs:
  measurement:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Trust only the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/precision-session.test.cjs
      - run: npx playwright test tests/precision-session.spec.cjs tests/growth-characterization.spec.cjs --project=${{ matrix.browser }}-mobile --workers=1
