name: Growth listening checks
# 들어 보고 남기는 평가, 결과 리포트 › 무엇이 달라졌나 with its 귀와 숫자 and 그 사이에 한 것 (and the pure 성장 개편 models: the
# "늘었나" take filter, periods, 다음 연습 — tests/growth-b1-models.test.cjs, tests/growth-next.test.cjs) on every browser project before merge (chromium-mobile,
# chromium-desktop and webkit-mobile). New specs that ran only in the long ui job let WebKit-only failures reach the
# iPhone before.
on:
  pull_request:
    paths:
      - 'app/listen-verdict*'
      - 'app/growth-changes-*'
      - 'app/growth-between-*'
      - 'app/practice-time-model.js'
      - 'app/ear-agreement-*'
      - 'app/growth-listen.css'
      - 'app/segment-ab-*'
      - 'app/monthly-growth.js'
      - 'app/overall-growth-*.js'
      - 'app/growth-metrics-model.js'
      - 'app/growth-dataset.js'
      - 'app/growth-range-*.js'
      - 'app/growth-next-model.js'
      - 'app/practice-review-model.js'
      - 'app/score-points-model.js'
      - 'app/student-home-model.js'
      - 'app/practice-set-model.js'
      - 'app/goal-routines.js'
      - 'app/precision-report-model.js'
      - 'app/precision-session-model.js'
      - 'app/precision-result-store.js'
      - 'app/vocal-lab.js'
      - 'app/mr-reanalyze.js'
      - 'app/analysis.js'
      - 'app/views-lessons.js'
      - 'app/media.js'
      - 'app/core.js'
      - 'index.html'
      - 'tests/growth-listen*'
      - 'tests/growth-ear*'
      - 'tests/growth-method-fix*'
      - 'tests/growth-between*'
      - 'tests/growth-characterization*'
      - 'tests/growth-b1*'
      - 'tests/growth-next*'
      - '.github/workflows/growth-listen-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growth-listen-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  growth-listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/growth-listen.test.cjs tests/growth-ear.test.cjs tests/segment-ab.spec.cjs tests/growth-metrics.test.cjs tests/growth-dataset.test.cjs tests/growth-method-fix.test.cjs tests/growth-between.test.cjs tests/growth-b1-models.test.cjs tests/growth-next.test.cjs
      # Every project of playwright.config.cjs: chromium-mobile, webkit-mobile and chromium-desktop.
      - run: npx playwright test tests/growth-listen.spec.cjs tests/growth-ear.spec.cjs tests/growth-method-fix.spec.cjs tests/growth-between.spec.cjs --project=chromium-mobile --project=chromium-desktop --project=webkit-mobile --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-listen-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
