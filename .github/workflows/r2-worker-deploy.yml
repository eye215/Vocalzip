name: R2 media worker deploy
# Deploys r2-worker (Cloudflare Worker "vocalzip-media") from main, only when started by hand.
# Needs two repository secrets set by the owner: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID. Worker secrets (SIGNING_SECRET, SUPABASE_JWT_SECRET) already on Cloudflare are kept.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r2-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'eye215/Vocalzip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: r2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: r2-worker/package-lock.json
      - run: npm ci
      - name: Worker tests before deploying
        run: npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."; exit 1
          fi
          npx wrangler deploy
