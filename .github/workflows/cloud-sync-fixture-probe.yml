name: Cloud snapshot fixture probe
on:
  push:
    branches: ['codex/lesson-selective-delete-20261109']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-name-pattern='empty new device loads' tests/cloud-sync.test.cjs
