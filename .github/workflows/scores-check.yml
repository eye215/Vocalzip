name: Score upload checks
on:
  push:
    branches: ['codex/score-private-ink-20261110']
  pull_request:
    paths:
      - 'app/scores.js'
      - 'app/score-ink*'
      - 'app/core.js'
      - 'data-merge.js'
      - 'tests/score-ink*'
      - 'tests/scores.spec.cjs'
      - '.github/workflows/scores-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scores-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  scores:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/score-ink-model.test.cjs tests/data-merge.test.cjs
      - name: Pinned PDF.js renderer for actual browser PDF tests
        run: npm install --prefix /tmp/vzip-score-pdfjs --ignore-scripts --omit=optional pdfjs-dist@4.10.38
      - run: npx playwright test tests/scores.spec.cjs tests/score-ink.spec.cjs --workers=2
        env:
          VZ_INK_PREVIEW: '1'
      # Previous full-suite run timed out in this existing WebKit calendar route.
      - name: Repeat metadata date edit regression in WebKit
        run: npx playwright test tests/ui.spec.cjs --project=webkit-mobile --grep 'Metadata-derived dates remain editable' --repeat-each=3 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-upload-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
