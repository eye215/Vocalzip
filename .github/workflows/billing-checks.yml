name: Billing checks
on:
  pull_request:
    paths:
      - 'billing/**'
      - '.github/workflows/billing-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ledger and import unit tests
        run: node --test billing/tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          for file in billing/*.js; do node --check "$file"; done
      - run: npx playwright install --with-deps chromium webkit
      - name: Billing browser tests
        run: npx playwright test --config=billing/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-test-results
          path: |
            billing-report
            billing-results
          retention-days: 14
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: billing_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: billing_ci_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Disposable database fixtures
        run: psql -v ON_ERROR_STOP=1 -f billing/tests/sql-setup.sql
      - name: Apply billing migration
        run: psql -v ON_ERROR_STOP=1 -f billing/migrations/20261104_billing_cloud.sql
      - name: RLS, RPC privileges and optimistic revisions
        run: psql -v ON_ERROR_STOP=1 -f billing/tests/cloud.sql
      - name: Concurrent cloud writes
        run: node billing/tests/concurrency.cjs
