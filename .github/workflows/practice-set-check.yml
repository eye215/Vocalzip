name: Practice set checks
on:
  pull_request:
    paths:
      - 'app/practice-set*'
      - 'app/goal-routines.js'
      - 'app/practice-time-model.js'
      - 'app/student-home-model.js'
      - 'design-system/student-home-app.js'
      - 'design-system/student-home-html.js'
      - 'tests/practice-set*'
      - '.github/workflows/practice-set-check.yml'
permissions:
  contents: read
jobs:
  practice-set:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/practice-set-model.test.cjs tests/goal-routines.test.cjs tests/practice-time.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/practice-set.spec.cjs --project=chromium-mobile --project=webkit-mobile --project=chromium-desktop --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-set-regression
          path: |
            playwright-report/
            test-results/
