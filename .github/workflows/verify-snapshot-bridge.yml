name: Verify published snapshot bridge remains off
on:
  push:
    branches: ['codex/verify-snapshot-bridge-f153eac91d99']
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public runtime hashes and inactive snapshot setting
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import vm from 'node:vm';
          const hash=x=>createHash('sha256').update(x).digest('hex');
          const paths=['index.html','legacy.html','account-config.js','cloud-sync.js','sync/snapshot-transport.js','app/lesson-deletion.js','data-merge.js','app/account-scope.js','app/media.js','app/import-hub.js','app/views-main.js','app/views-more.js','media-naming.js','app/repertoire.js','app/song-detail.css','app/library-select.js','app/processing-log.js','app/song-suggestions.js','app/song-check-ui.css'];
          let verified=false;
          for(let attempt=1;attempt<=6;attempt++){
           const results=await Promise.all(paths.map(async path=>{
            try{
             const local=await readFile(path),r=await fetch('https://vocalzip.yullul.com/'+path+'?verify='+process.env.GITHUB_SHA+'-'+attempt,{redirect:'error',signal:AbortSignal.timeout(15000)});
             const bytes=Buffer.from(await r.arrayBuffer());
             if(path==='account-config.js'&&r.ok){
              const context={window:{}};vm.runInNewContext(bytes.toString('utf8'),context);
              if(context.window.VZIP_SNAPSHOT_REVISION_ENABLED!==false)throw Error('snapshot bridge unexpectedly active');
             }
             return {path,status:r.status,sha256_match:r.ok&&hash(local)===hash(bytes)};
            }catch(e){return {path,sha256_match:false,error:e.message};}
           }));
           console.log(JSON.stringify({attempt,results}));
           if(results.every(r=>r.sha256_match)){verified=true;break;}
           if(attempt<6)await new Promise(r=>setTimeout(r,15000));
          }
          if(!verified)process.exitCode=1;
          NODE
