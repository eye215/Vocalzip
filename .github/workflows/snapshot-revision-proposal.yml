name: Snapshot revision proposal checks
on:
  pull_request:
    paths:
      - 'supabase/proposals/20261113_snapshot_revision.sql'
      - 'supabase/migrations/20261112_device_session_contract.sql'
      - 'tests/snapshot-revision.test.mjs'
      - '.github/workflows/snapshot-revision-proposal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revision-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: snapshot_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Revision, idempotency, RLS and real session guard in disposable DB
        env:
          VZ_SNAPSHOT_TEST_DB: postgres://postgres:snapshot_ci_only@localhost:5432/postgres
        run: node --test tests/snapshot-revision.test.mjs
