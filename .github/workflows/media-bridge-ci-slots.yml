name: Metadata bridge representative take regression
on:
  push:
    branches: ['verify/media-edit-bridge-ci-20261110']
permissions:
  contents: read
jobs:
  representative-take:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-main
            sha: ae9540e8a7861c2f6207099b7237ee38e5aab88c
          - label: metadata-bridge
            sha: 9089fedc765878cb316310d979ba7bbd09312ce5
    name: representative-take (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright test tests/repertoire.spec.cjs --project=webkit-mobile --grep 'Representative take references' --repeat-each=3 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-take-${{ matrix.label }}
          path: test-results/
          retention-days: 7
