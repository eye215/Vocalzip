name: Growth listening checks
# 들어 보고 남기는 평가, 결과 리포트 › 무엇이 달라졌나 with its 귀와 숫자 and 그 사이에 한 것 (and the pure 성장 개편 models: the
# "늘었나" take filter, periods, 다음 연습 — tests/growth-b1-models.test.cjs, tests/growth-next.test.cjs) on every browser project before merge (chromium-mobile,
# chromium-desktop and webkit-mobile) — also 월별 분석 › 곡별 (tests/growth-monthly-song.spec.cjs) and 성장 › 이번 달
# (phase 2: app/growth-month*.js, tests/growth-month.test.cjs, tests/growth-month.spec.cjs). New specs that ran only in the long ui job let WebKit-only failures reach the
# iPhone before. Phase 3: the 곡 tab — 곡 목록 and 곡 하나, the former 보컬 연구소 (app/growth-song-model.js, app/growth-hub.js,
# app/vocal-lab.js; tests/growth-song.test.cjs, tests/growth-song.spec.cjs).
# Phase 4 (연구소 · 연습 화면은 오늘): app/growth-lab.js, the 연습하기 section of design-system/student-home-*.js; tests/growth-b4-lab.spec.cjs.
on:
  pull_request:
    paths:
      - 'app/listen-verdict*'
      - 'app/listen-session*'
      - 'app/growth-song-page*'
      - 'app/song-check*'
      - 'app/growth-changes-*'
      - 'app/growth-between-*'
      - 'app/practice-time-model.js'
      - 'app/ear-agreement-*'
      - 'app/growth-listen.css'
      - 'app/segment-ab-*'
      - 'app/monthly-growth.js'
      - 'app/overall-growth-*.js'
      - 'app/growth-metrics-model.js'
      - 'app/growth-dataset.js'
      - 'app/growth-range-*.js'
      - 'app/growth-next-model.js'
      - 'app/growth-song-model.js'
      - 'app/vocal-lab.css'
      - 'app/growth-month*'
      - 'app/growth-hub.*'
      - 'app/growth-lab.js'
      - 'app/voice-check.js'
      - 'app/practice-room.js'
      - 'app/views-more.js'
      - 'design-system/student-home-app.js'
      - 'design-system/student-home-html.js'
      - 'app/weekly-summary*'
      - 'app/practice-review-model.js'
      - 'app/score-points-model.js'
      - 'app/student-home-model.js'
      - 'app/practice-set-model.js'
      - 'app/goal-routines.js'
      - 'app/precision-report-model.js'
      - 'app/precision-session-model.js'
      - 'app/precision-result-store.js'
      - 'app/vocal-lab.js'
      - 'app/mr-reanalyze.js'
      - 'app/analysis.js'
      - 'app/views-lessons.js'
      - 'app/media.js'
      - 'app/core.js'
      - 'index.html'
      - 'tests/growth-listen*'
      - 'tests/listen-session*'
      - 'tests/song-check*'
      - 'tests/growth-ear*'
      - 'tests/growth-method-fix*'
      - 'tests/growth-between*'
      - 'tests/growth-characterization*'
      - 'tests/growth-b1*'
      - 'tests/growth-next*'
      - 'tests/growth-monthly*'
      - 'tests/growth-month.*'
      - 'tests/growth-song*'
      - 'tests/growth-b4*'
      - 'tests/helpers/song-screen.cjs'
      - 'tests/lab-clear-selection.cjs'
      - '.github/workflows/growth-listen-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growth-listen-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  growth-listen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/growth-listen.test.cjs tests/growth-ear.test.cjs tests/segment-ab.spec.cjs tests/growth-metrics.test.cjs tests/growth-dataset.test.cjs tests/growth-method-fix.test.cjs tests/growth-between.test.cjs tests/growth-b1-models.test.cjs tests/growth-next.test.cjs tests/growth-month.test.cjs tests/growth-song.test.cjs tests/listen-session-model.test.cjs tests/song-check-model.test.cjs
      # Every project of playwright.config.cjs: chromium-mobile, webkit-mobile and chromium-desktop.
      - run: npx playwright test tests/growth-listen.spec.cjs tests/growth-ear.spec.cjs tests/growth-method-fix.spec.cjs tests/growth-between.spec.cjs tests/growth-monthly-song.spec.cjs tests/growth-month.spec.cjs tests/growth-song.spec.cjs tests/growth-b4-lab.spec.cjs tests/listen-session.spec.cjs tests/growth-song-page.spec.cjs tests/song-check.spec.cjs --project=chromium-mobile --project=chromium-desktop --project=webkit-mobile --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-listen-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
