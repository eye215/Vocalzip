name: Practice set checks
on:
  pull_request:
    paths:
      - 'app/practice-set*'
      - 'app/daily-set*'
      - 'app/daily-measure*'
      - 'app/levels*'
      - 'app/roadmap*'
      - 'app/recording-time*'
      - 'app/record-handoff.js'
      - 'app/practice-tips.js'
      - 'app/growth-next-model.js'
      - 'app/guided-practice.js'
      - 'app/voice-path-model.js'
      - 'app/listen-verdict.js'
      - 'design-system/shared-nav.css'
      - 'app/goal-routines.js'
      - 'app/practice-time-model.js'
      - 'app/student-home-model.js'
      - 'design-system/student-home-app.js'
      - 'design-system/student-home-html.js'
      - 'tests/practice-set*'
      - 'tests/daily-set*'
      - 'tests/daily-measure*'
      - 'tests/levels*'
      - 'tests/roadmap*'
      - 'tests/recording-time*'
      - 'tests/record-handoff*'
      - 'tests/helpers/levels-fixture.cjs'
      - '.github/workflows/practice-set-check.yml'
permissions:
  contents: read
jobs:
  practice-set:
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # three specs on three browsers; the browser install alone can take 8+ minutes on a busy runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/practice-set-model.test.cjs tests/daily-set-model.test.cjs tests/daily-measure-model.test.cjs tests/levels-model.test.cjs tests/roadmap-model.test.cjs tests/recording-time-model.test.cjs tests/goal-routines.test.cjs tests/practice-time.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      # 오늘의 연습: the set list and the person's own steps (practice-set), the card, the doing screen, 고르기 and the takes (daily-set).
      # 단계: the line on 오늘, the 단계 page, the step a finished set earns, the kept rows through a sync (levels).
      # 호흡 · 리듬 · 비브라토 · 스케일 · 사이렌 · 맨 위 음: the measuring exercises on the doing screen and what they write for 단계 (daily-set-measure).
      - run: npx playwright test tests/practice-set.spec.cjs tests/daily-set.spec.cjs tests/daily-set-measure.spec.cjs tests/levels.spec.cjs tests/record-handoff.spec.cjs --project=chromium-mobile --project=webkit-mobile --project=chromium-desktop --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-set-regression
          path: |
            playwright-report/
            test-results/
