name: Cloud snapshot safety
on:
  pull_request:
    paths:
      - 'cloud-sync.js'
      - 'data-merge.js'
      - 'tests/cloud-sync.test.cjs'
      - '.github/workflows/cloud-sync-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cloud-sync.test.cjs tests/data-merge.test.cjs tests/media-delete.test.cjs
