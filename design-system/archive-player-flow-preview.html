<script>
const $=id=>document.getElementById(id),sheet=$('backdrop');let currentRow=document.querySelector('.record.open');document.querySelectorAll('.record>.file').forEach(button=>button.onclick=()=>{const row=button.parentElement,details=$('details');if(currentRow===row){row.classList.remove('open');button.setAttribute('aria-expanded','false');details.hidden=true;currentRow=null;playing=false;return}currentRow?.classList.remove('open');currentRow?.querySelector('.file').setAttribute('aria-expanded','false');row.append(details);details.hidden=false;row.classList.add('open');button.setAttribute('aria-expanded','true');currentRow=row;duration=Number(row.dataset.duration)||225;seconds=0;paint();$('details').querySelector('.timing span:last-child').textContent=Math.floor(duration/60)+':'+String(duration%60).padStart(2,'0');playing=false;$('play').innerHTML='<i class="ph-fill ph-play"></i>';$('play').setAttribute('aria-label','재생')});function openSheet(){sheet.hidden=false;document.body.style.overflow='hidden';$('name').value=currentRow?.dataset.title||'정자동 4';$('name').focus()}function closeSheet(){sheet.hidden=true;document.body.style.overflow='';$('edit').focus()}$('edit').onclick=openSheet;$('close').onclick=closeSheet;sheet.onclick=e=>{if(e.target===sheet)closeSheet()};document.onkeydown=e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()};$('save').onclick=()=>{currentRow.dataset.title=$('name').value.trim()||currentRow.dataset.title;currentRow.querySelector('strong').textContent=currentRow.dataset.title;closeSheet()};document.querySelectorAll('.kind button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.kind button').forEach(x=>x.classList.toggle('selected',x===b))});let playing=true,seconds=3,rate=1,duration=225;const rates=[1,1.25,.5,.75];$('play').onclick=()=>{playing=!playing;$('play').innerHTML=playing?'<i class="ph-fill ph-pause"></i>':'<i class="ph-fill ph-play"></i>';$('play').setAttribute('aria-label',playing?'일시정지':'재생')};$('speed').onclick=()=>{rate=ra
