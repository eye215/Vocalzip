# VOCAL.zip score conversion (OMR PoC): converts score PDFs to MusicXML with Audiveris (AGPL-3.0, run unmodified as a
# separate program). Jobs exist only when an owner pressed "음표로 변환" in the app.
# No repository secrets: the run proves itself to the media Worker with GitHub's OIDC token (audience vocalzip-omr);
# the Worker accepts only this file on main, started by schedule or by hand. Free on GitHub-hosted runners (public repo).
# Logs show counts only. Nothing is uploaded as a run artifact (artifacts of a public repository are public).
name: Score conversion
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'How many scores at most'
        default: ''
  pull_request:
    paths:
      - 'worker/omr-worker.mjs'
      - '.github/workflows/omr-worker.yml'
permissions:
  contents: read
concurrency:
  group: omr-worker-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  convert:
    if: github.repository == 'eye215/Vocalzip' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: write # only to start the next run while scores are still waiting (GitHub's 10-minute schedule can lag for hours)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/audiveris-deb
          key: audiveris-deb-ubuntu24-v1
      - name: Convert waiting scores
        id: convert
        env:
          OMR_MAX_JOBS: ${{ inputs.max_jobs }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node worker/omr-worker.mjs
      # A run that converted (or tried) scores starts the next one itself; a run that found nothing ends the chain.
      - name: Continue while scores wait
        if: success() && steps.convert.outputs.processed != '' && steps.convert.outputs.processed != '0' && inputs.max_jobs == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run omr-worker.yml --ref "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY" && echo "started the next run"

  # Pull requests: install the same engine and convert a freshly engraved public-domain melody, so an engine or
  # script change is checked end to end without touching any user's score.
  selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engrave a test melody
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends lilypond
          mkdir -p /tmp/omr && cd /tmp/omr
          printf '%s\n' '\version "2.24.0"' '\header { tagline = ##f }' '\paper { indent = 0 }' \
            '\score { \new Staff \relative c'"'"' { \clef treble \key c \major \time 4/4 c4 d e f | g2 g | a4 a g2 | f4 f e e | d d c2 \bar "|." } \layout { } }' > melody.ly
          lilypond -dno-point-and-click -o melody melody.ly
          ls -l melody.pdf
      - name: Convert with Audiveris
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node worker/omr-worker.mjs --selftest /tmp/omr/melody.pdf | tee /tmp/omr/result.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/omr/result.json','utf8').trim().split('\n').pop());if(r.notes<14||!['C','D','E','F','G','A'].every(s=>r.steps.includes(s))){console.error('unexpected recognition',JSON.stringify(r));process.exit(1)}"
