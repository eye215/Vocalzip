name: Student home live release check
on:
  push:
    branches: ['codex/student-home-release-check-128']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a80d0946542b4aaa0a246ee305e336096053acb7
      - name: Read public production assets and verify release bytes
        env:
          RELEASE_SHA: a80d0946542b4aaa0a246ee305e336096053acb7
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, time, urllib.request
          base = 'https://vocalzip.yullul.com/'
          paths = ['index.html', 'app/core.js', 'data-merge.js',
                   'app/student-home-model.js', 'design-system/student-home-app.js',
                   'design-system/components.js', 'design-system/approved-home.css',
                   'design-system/components.css', 'design-system/tokens.css',
                   'design-system/assets/home-lavender-light.svg',
                   'design-system/assets/home-stage.svg',
                   'design-system/assets/home-recent-cover.svg']
          pending = set(paths)
          deadline = time.monotonic() + 180
          results = {}
          while pending and time.monotonic() < deadline:
              for name in list(pending):
                  url = base if name == 'index.html' else base + name
                  try:
                      req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'Vocalzip-read-only-release-check'})
                      with urllib.request.urlopen(req, timeout=12) as response:
                          status = response.status
                          actual = response.read()
                      expected = pathlib.Path(name).read_bytes()
                      matched = status == 200 and actual == expected
                      results[name] = (status, matched)
                      if matched:
                          pending.remove(name)
                          print('PASS', name, 'HTTP', status, 'sha256', hashlib.sha256(actual).hexdigest(), flush=True)
                  except Exception as exc:
                      results[name] = (type(exc).__name__, False)
              if pending:
                  print('Waiting for release propagation:', ', '.join(sorted(pending)), flush=True)
                  time.sleep(8)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('# Public release verification\n\nRelease: ' + os.environ['RELEASE_SHA'] + '\n\n')
              for name in paths:
                  summary.write('- ' + name + ': ' + ('PASS' if name not in pending else 'FAIL') + '\n')
              summary.write('\nOnly unauthenticated public GET requests were made. No user data, database, or media writes. Physical iPhone/PWA remains unverified.\n')
          if pending:
              raise SystemExit('Release mismatch: ' + repr({name: results.get(name) for name in sorted(pending)}))
          print('Verified all 12 public release assets. No user data was accessed.', flush=True)
          PY
