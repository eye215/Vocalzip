name: Actual practice time checks
on:
  push:
    branches: ['codex/actual-practice-time-20261109']
  pull_request:
    paths:
      - 'app/practice-time-model.js'
      - 'tests/practice-time.test.cjs'
      - '.github/workflows/practice-time-check.yml'
permissions:
  contents: read
jobs:
  practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Actual practice time across existing screens
        run: npx playwright test tests/v6.spec.cjs --grep 'Actual practice time' --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-practice-time-regression
          path: |
            playwright-report/
            test-results/
