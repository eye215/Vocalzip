<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
#vocalzip-refined-preview{padding:16px 0;display:flex;justify-content:center;}
#vocalzip-refined-preview .vz-phone{--vz-accent:#7A32F5;--vz-pressed:#6528CA;--vz-soft:#F3ECFF;--vz-title:#101828;--vz-primary:#344054;--vz-body:#475467;--vz-muted:#667085;box-sizing:border-box;width:100%;max-width:390px;background:#F8F6FD;color:var(--vz-title);border-radius:32px;padding:12px 16px 8px;font:400 14px/1.45 Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.02em;}
#vocalzip-refined-preview *{box-sizing:border-box;}
#vocalzip-refined-preview button{font:inherit;letter-spacing:inherit;border:0;background:none;color:inherit;}
#vocalzip-refined-preview button:focus-visible{outline:2px solid var(--vz-accent);outline-offset:3px;}
#vocalzip-refined-preview svg{width:20px;height:20px;stroke-width:1.8;flex-shrink:0;}
#vocalzip-refined-preview h2,#vocalzip-refined-preview h3,#vocalzip-refined-preview p{margin:0;}
#vocalzip-refined-preview h2{font-size:18px;font-weight:700;line-height:26px;}
#vocalzip-refined-preview .vz-header{display:flex;align-items:center;justify-content:space-between;min-height:52px;}
#vocalzip-refined-preview .vz-logo{display:flex;align-items:center;gap:6px;font-size:16px;}
#vocalzip-refined-preview .vz-logo svg{color:var(--vz-accent);}
#vocalzip-refined-preview .vz-header-actions{display:flex;}

#vocalzip-refined-preview .vz-schedule{padding:16px 4px 12px;}
#vocalzip-refined-preview .vz-event{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:68px;}
#vocalzip-refined-preview .vz-event-heading{display:flex;align-items:center;gap:10px;}
#vocalzip-refined-preview .vz-event h2{font-size:22px;line-height:30px;}
#vocalzip-refined-preview .vz-dday{font-size:12px;color:var(--vz-accent);font-weight:600;background:var(--vz-soft);padding:3px 7px;border-radius:7px;}
#vocalzip-refined-preview .vz-event p{color:var(--vz-muted);margin-top:6px;}
#vocalzip-refined-preview .vz-hero-icon{width:34px;height:34px;color:#A28ACC;stroke-width:1.6;margin-right:8px;}
#vocalzip-refined-preview .vz-event-row{display:flex;align-items:center;width:100%;min-height:44px;gap:8px;text-align:left;padding:0;}
#vocalzip-refined-preview .vz-kind{width:34px;flex-shrink:0;color:var(--vz-muted);font-size:12px;}
#vocalzip-refined-preview .vz-event-row strong{font-weight:600;color:var(--vz-primary);}
#vocalzip-refined-preview .vz-row-day{margin-left:auto;font-size:12px;color:var(--vz-accent);font-weight:600;}
#vocalzip-refined-preview .vz-event-row>svg{width:16px;color:#98A2B3;}
#vocalzip-refined-preview .vz-card{background:#FFFFFF;border-radius:20px;padding:20px;}
#vocalzip-refined-preview main>.vz-card,#vocalzip-refined-preview .vz-quick-grid{margin-bottom:12px;}
#vocalzip-refined-preview .vz-card-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#vocalzip-refined-preview .vz-title{display:flex;align-items:center;gap:8px;min-width:0;}
#vocalzip-refined-preview .vz-title>svg{color:var(--vz-body);}
#vocalzip-refined-preview .vz-title .vz-chevron{width:14px;color:#98A2B3;margin-left:-4px;}

#vocalzip-refined-preview .vz-streak{display:flex;align-items:center;gap:3px;}
#vocalzip-refined-preview .vz-streak svg{width:13px;height:13px;}

#vocalzip-refined-preview .vz-shortcut{display:flex;align-items:center;justify-content:space-between;gap:4px;text-align:left;padding:16px;color:var(--vz-body);}
#vocalzip-refined-preview .vz-shortcut>span{display:flex;align-items:center;gap:8px;}
#vocalzip-refined-preview .vz-shortcut strong{font-size:14px;font-weight:600;white-space:nowrap;}
#vocalzip-refined-preview .vz-shortcut .vz-chevron{width:14px;color:#98A2B3;}
#vocalzip-refined-preview .vz-goals{padding-top:14px;padding-bottom:12px;}

<script>
(() => {
  const root=document.getElementById('vocalzip-refined-preview');
  const checks=Array.from(root.querySelectorAll('input[type=checkbox]'));
  root.querySelectorAll('button,label').forEach(el=>el.classList.add('cursor-interaction'));
  checks.forEach(input=>input.addEventListener('change',()=>{
    root.querySelector('.vz-count').textContent=checks.filter(el=>el.checked).length+' / 3 완료';
  }));
  const phone=root.querySelector('.vz-phone');
  const state={glow:13,navOpacity:78,navBlur:20,titleWeight:'700'};
  function render(){phone.style.setProperty('--vz-hero-strength',state.glow/100);phone.style.setProperty('--vz-nav-alpha',state.navOpacity/100);phone.style.setProperty('--vz-nav-blur',state.navBlur+'px');phone.style.setProperty('--vz-card-title-weight',state.titleWeight);}
  render();
  if(globalThis.Tweak){
    const schedule=new Tweak({container:root.querySelector('.vz-schedule'),onChange:render});
    schedule.addSlider(state,'glow',{label:'상단 보라빛',min:0,max:24,unit:'%',reference:'--vz-hero-strength'});
    const nav=new Tweak({container:root.querySelector('.vz-nav'),onChange:render});
    nav.addSlider(state,'navOpacity',{label:'네비 불투명도',min:55,max:90,unit:'%',reference:'--vz-nav-alpha'});
    nav.addSlider(state,'navBlur',{label:'네비 블러',min:8,max:32,unit:'px',reference:'--vz-nav-blur'});
    const type=new Tweak({container:root.querySelector('.vz-week'),onChange:render});
    type.addSelect(state,'titleWeight',{label:'카드 제목 굵기',options:[{label:'세미볼드 600',value:'600'},{label:'볼드 700',value:'700'}],reference:'--vz-card-title-weight'});
  }
})();
</script>
