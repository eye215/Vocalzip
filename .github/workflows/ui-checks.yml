name: UI browser checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/chunk-media.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/chunk-stream.spec.cjs --project=chromium-desktop --workers=1
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
