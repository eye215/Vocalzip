name: Selective lesson deletion safety
on:
  push:
    branches: ['codex/lesson-selective-delete-20261109']
  pull_request:
    paths:
      - 'app/lesson-deletion*'
      - 'app/views-lessons.js'
      - 'data-merge.js'
      - 'cloud-sync.js'
      - 'billing/**'
      - 'tests/lesson-deletion*'
      - '.github/workflows/lesson-deletion-check.yml'
permissions:
  contents: read
jobs:
  deletion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/lesson-deletion.test.cjs tests/media-delete.test.cjs tests/data-merge.test.cjs tests/cloud-sync.test.cjs billing/tests/*.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Existing lesson deletion preserves unselected records
        run: npx playwright test tests/v6.spec.cjs --grep 'Lesson delete keeps|Lesson deletion' --workers=2
      - name: Cloud cancellation acknowledgement and restore guards
        run: npx playwright test --config=billing/playwright.config.cjs billing/tests/autosync.spec.cjs --grep 'Deletion receipt' --workers=2
      - name: Settlement regression
        run: npx playwright test --config=billing/playwright.config.cjs billing/tests/lesson-settlement.spec.cjs --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-lesson-deletion
          path: |
            test-results/
            playwright-report/
            billing-results/
            billing-report/

  accounts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/account-session.spec.cjs --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-account-isolation
          path: |
            playwright-report/
            test-results/

  billing-all:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no Ubuntu 26.04 build; ubuntu-latest moved there in Oct 2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ledger and import unit tests
        run: node --test billing/tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          for file in billing/*.js; do node --check "$file"; done
      - run: npx playwright install --with-deps chromium webkit
      - name: Billing browser tests
        run: npx playwright test --config=billing/playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deletion-billing-all
          path: |
            billing-report
            billing-results
          retention-days: 14

  deletion-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: deletion_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Permanent lesson deletion and history privacy in disposable PostgreSQL
        env:
          VZ_DELETE_TEST_DB: postgres://postgres:deletion_ci_only@localhost:5432/postgres
        run: node --test tests/permanent-lesson-delete.test.mjs
