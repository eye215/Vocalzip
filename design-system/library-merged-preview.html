nt:space-around;box-shadow:0 4px 20px #23143c0a}nav span{display:grid;place-items:center;gap:2px;width:24%;height:54px;font-size:11px;color:#667085}nav i{font-style:normal;font-size:24px}nav .current{border-radius:99px;background:#ede1ff;color:#7a32f5;font-weight:650}.fab{position:fixed;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:94px;border:0;border-radius:50%;width:56px;height:56px;background:linear-gradient(135deg,#9557ff,#7a32f5,#6d2be5);color:white;font-size:25px;box-shadow:0 5px 14px #6d2be52e}@media(max-width:350px){.tabs button{padding:0 9px}.player{gap:3px;padding-left:3px}.time{font-size:10px}.more{width:44px}}
</style></head><body><main><header><h1>보관함</h1><small>25개</small><div class="spacer"></div><button aria-label="가져오기">⇩</button><button aria-label="메뉴">⋯</button></header><div class="tabs"><button class="on">전체</button><button>공연</button><button>레슨</button><button>연습</button><button class="search" aria-label="검색">⌕</button></div><div class="review">곡 확인 <b>3건</b><span>›</span></div><div class="meta"><b>25개 · 총 1시간 17분</b><p>모두 클라우드에 백업됨</p></div><div class="selection" id="selection"><button class="start" id="start">선택</button><div class="select-left"><button class="all" id="all"><span class="box"></span>전체 선택</button><button class="cancel" id="cancel">취소</button></div><div class="select-right"><strong id="count">0개 선택</strong><button class="bulk" id="bulk" aria-label="선택한 녹음 더보기" disabled>⋯</button></div></div><section class="month"><div class="month-head"><b>2026년 11월</b><small>25개 · 1시간 17분</small></div><div class="card" id="card"></div></section></main><button class="fab" aria-label="녹음 시작">♩</button><nav><span><i>⌂</i>홈</span><span><i>♫</i>내 곡</span><span class="current"><i>▣</i>보관함</span><span><i>▦</i>일정</span></nav><script>
const names=['정자동 4','정자동 3','26-11-08 summer in Ohio 마무리','The River 2026.11.08'], durations=['3:45','3:11','3:52','3:51'];let selected=new Set(),current=0,playing=false;const card=document.querySelector('#card'),selection=document.querySelector('#selection');card.innerHTML=names.map((n,i)=>`<div class="record ${i===0?'open':''}" data-i="${i}"><div class="row"><button class="pick" aria-label="${n} 선택"><span class="box"></span></button><button class="title-btn" aria-expanded="${i===0}"><span class="wave">♩</span><span class="copy"><strong>${n}</strong><small>11월 8일 (일) · ${durations[i]} · 연습</small></span><span class="chev">${i===0?'⌃':'⌄'}</span></button></div><div class="player"><button class="play" aria-label="재생"><span>▶</span></button><input class="bar" type="range" min="0" max="225" value="0" aria-label="재생 위치"><span class="time">0:00 / ${durations[i]}</span><button class="more" aria-label="${n} 더보기">⋯</button></div></div>`).join('');function paint(){selection.classList.toggle('active',window.selecting);document.querySelectorAll('.record').forEach(r=>r.querySelector('.pick').classList.toggle('checked',selected.has(+r.dataset.i)));document.querySelector('#all').classList.toggle('checked',selected.size===names.length);document.querySelector('#count').textContent=selected.size+'개 선택';document.querySelector('#bulk').disabled=!selected.size}document.querySelector('#start').onclick=()=>{window.selecting=true;paint()};document.querySelector('#cancel').onclick=()=>{window.selecting=false;selected.clear();paint()};document.querySelector('#all').onclick=()=>{selected.size===names.length?selected.clear():names.forEach((_,i)=>selected.add(i));paint()};card.onclick=e=>{let r=e.target.closest('.record');if(!r)return;let i=+r.dataset.i;if(e.target.closest('.pick')){selected.has(i)?selected.delete(i):selected.add(i);paint()}else if(e.target.closest('.title-btn')){let was=r.classList.contains('open');document.querySelectorAll('.record').forEach(x=>{x.classList.remove('open');x.querySelector('.title-btn').setAttribute('aria-expanded','false');x.querySelector('.chev').textContent='⌄'});if(!was){r.classList.add('open');r.querySelector('.title-btn').setAttribute('aria-expanded','true');r.querySelector('.chev').textContent='⌃';current=i}}else if(e.target.closest('.play')){playing=!playing;e.target.closest('.play').querySelector('span').textContent=playing?'❚❚':'▶'}else if(e.target.closest('.more'))alert('녹음 더보기 · 정보 수정 / 저장 / 보컬 분석 / 기타 작업')};paint();
