name: Goal and homework integrity
on:
  push:
    branches: ['codex/goal-homework-integrity-20261109']
  pull_request:
    paths:
      - 'app/student-home-model.js'
      - 'app/practice-time-model.js'
      - 'app/views-lessons.js'
      - 'design-system/student-home-app.js'
      - 'tests/goal-homework-integrity.test.cjs'
      - '.github/workflows/goal-homework-integrity-check.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/goal-homework-integrity.test.cjs tests/student-home-model.test.cjs tests/practice-time.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Goal editor and homework integrity on mobile and desktop
        run: npx playwright test tests/student-home.spec.cjs --grep 'Goal integrity|Homework integrity|goal editor saves|goal selection remains|checked goal persists|persistence failure restores|weekly home keeps actual' --workers=2
      - name: Existing homework writes and practice editing
        run: >-
          npx playwright test tests/v6.spec.cjs --grep 'Homework has a period|Homework: add|Lesson delete keeps homework|Practice records can be edited' --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-homework-integrity
          path: |
            playwright-report/
            test-results/
