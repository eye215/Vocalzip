name: Verify staged resumable web release
on:
  push:
    branches: ['codex/verify-resumable-web-release-20261108']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare deployed scripts and read public storage health
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const paths=['index.html','legacy.html','r2-resumable-upload.js','r2-storage.js','cloud-sync.js','record-calendar.js','media-hub.js'];
          const results=await Promise.all(paths.map(async path=>{
            const local=await readFile(path);
            const response=await fetch('https://vocalzip.yullul.com/'+path+'?verify='+process.env.GITHUB_SHA,{redirect:'error',signal:AbortSignal.timeout(15000)});
            return {path,status:response.status,sha256_match:response.ok&&hash(local)===hash(Buffer.from(await response.arrayBuffer()))};
          }));
          for(const result of results)console.log(JSON.stringify(result));
          if(results.some(r=>!r.sha256_match))process.exitCode=1;
          const config=await readFile('r2-config.js','utf8');
          const endpoint="https://vocalzip-media.eye215.workers.dev";
          const health=await fetch(endpoint+'/health',{signal:AbortSignal.timeout(15000)}),state=await health.json();
          const anonymous=await fetch(endpoint+'/v1/me',{signal:AbortSignal.timeout(15000)});
          console.log(JSON.stringify({worker_health_status:health.status,bucket_bound:state.bucket,session_contract:state.sessionContract,anonymous_account_status:anonymous.status}));
          if(!health.ok||state.bucket!==true||state.sessionContract!=='v2'||anonymous.status!==401)process.exitCode=1;
          NODE
