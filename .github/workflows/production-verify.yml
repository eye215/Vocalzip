name: Verify published Vocalzip
on:
  pull_request:
    paths:
      - '.github/workflows/production-verify.yml'
      - 'playwright.production.config.cjs'
      - 'tests/check-production.cjs'
      - 'tests/production.smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-production.cjs
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: node tests/make-audio-fixtures.cjs
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.production.config.cjs --grep 'Published app|Video import copies|201MiB video extraction|Real queue extracts|Metadata-derived dates'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: |
            production-distribution-report.json
            production-playwright-report/
            production-test-results/
          retention-days: 7
