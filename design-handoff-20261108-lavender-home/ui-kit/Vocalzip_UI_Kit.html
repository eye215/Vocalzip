const link=(text,path,icon='ChevronRight')=>`<a class="text-link" href="#/${path}">${text}${I(icon)}</a>`;
const empty=(title,desc,action='')=>`<div class="empty"><div class="tile-icon">${I('Inbox')}</div><h3>${title}</h3><p>${desc}</p>${action}</div>`;
const tile=(icon,gray=false)=>`<span class="tile-icon ${gray?'gray':''}">${I(icon)}</span>`;
const row=(title,desc,path,icon='Music2',extra='')=>`<a class="list-row" href="#/${path}">${tile(icon)}<span class="grow"><span class="title">${esc(title)}</span><span class="desc">${esc(desc)}</span></span>${extra}${I('ChevronRight')}</a>`;
const field=(label,name,type='text',value='',hint='')=>`<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="1" max="1440"':''} required>${hint?`<span class="hint">${hint}</span>`:''}</label>`;
const songSelect=(value='s1',allowEmpty=false)=>`<label class="field"><span>연결 곡</span><select name="song">${allowEmpty?'<option value="">곡 미지정</option>':''}${data.songs.map(s=>`<option value="${s.id}" ${s.id===value?'selected':''}>${esc(s.title)}</option>`).join('')}</select></label>`;
function sheet(title,body,onSave){const dialog=$('#app-dialog');$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=body;$('#sheet-form').onsubmit=e=>{e.preventDefault();if(!$('#sheet-form').reportValidity())return;const ok=onSave?.(new FormData($('#sheet-form')));if(ok!==false)dialog.close();};dialog.showModal();}
function previewSheet(title,body){sheet(title,body,()=>true);$('#sheet-actions').innerHTML='<button class="btn secondary full" type="button" data-action="close-sheet">닫기</button>';}
function formSheet(title,body,onSave){$('#sheet-actions').innerHTML='<button class="btn secondary" type="button" data-action="close-sheet">취소</button><button class="btn" type="submit">저장</button>';sheet(title,body,onSave);}
function header(title,back='home',actions=''){return `<div class="head-left"><a class="icon-btn" aria-label="뒤로" href="#/${back}">${I('ChevronLeft')}</a><h1>${title}</h1></div><div class="header-actions">${actions||''}</div>`;}
const plus=action=>`<button class="icon-btn" aria-label="추가" type="button" data-action="${action}">${I('Plus')}</button>`;
const routes={
home(){return {title:'홈',nav:'home',home:true,html:window.VZ_HOME_HTML};},
songs(){return {title:'내 곡',nav:'songs',actions:plus('add-song'),html:`<label class="search">${I('Search')}<input id="songs-search" aria-label="곡 검색" placeholder="곡명·작품명 검색"></label><div class="chips">${['전체','연습 중','보관'].map(f=>`<button class="chip ${f===ui.songsFilter?'active':''}" data-filter-song="${f}">${f}</button>`).join('')}</div><div id="songs-results" class="ui-card"></div><div style="margin-top:12px">${link('레슨노트 보기','lessons')}${link('연습기록 보기','practice')}</div>`};},
song(id){const s=findSong(id);if(!s)return notFound();const ps=data.practices.filter(x=>x.song===id);return {title:'곡 상세',nav:'songs',back:'songs',actions:`<button class="icon-btn" aria-label="곡 수정" data-action="edit-song" data-id="${id}">${I('Pencil')}</button>`,html:`<div class="stack"><section class="ui-card song-tint"><span class="badge">${s.status}</span><h2 style="font-size:24px;line-height:32px;margin:12px 0 6px">${esc(s.title)}</h2><p class="muted">${esc(s.artist)}</p><div class="tag-line"><span class="badge neutral">${esc(s.key||'조성 미지정')}</span><span class="badge neutral">${esc(s.type)}</span></div></section>${btn('이 곡 연습 기록하기','practice-song:'+id,'full','Plus')}<section class="ui-card"><div class="section-head"><h2>연습 메모</h2></div><p class="body-copy">${esc(s.memo||'곡 수정에서 연습 메모를 남겨보세요.')}</p></section><section class="ui-card"><div class="section-head"><h2>최근 연습</h2>${link('전체','practice')}</div>${ps.length?ps.map(p=>row(`${p.minutes}분 연습`,dates(p.date),'practice/'+p.id,'History')).join(''):empty('첫 연습을 남겨보세요','작은 연습도 곡의 기록으로 쌓여요.')}</section><section class="ui-card"><div class="section-head"><h2>연결된 녹음</h2></div>${data.media.filter(m=>m.song===id).map(m=>row(m.name,m.duration+' · '+dates(m.date),'media/'+m.id,m.kind==='영상'?'Video':'AudioLines')).join('')||empty('연결된 녹음이 없어요','녹음 후 이 곡과 연결할 수 있어요.')}</section></div>`};},
library(){return {title:'보관함',nav:'library',actions:`<button class="icon-btn" aria-label="파일 가져오기" data-action="import">${I('Upload')}</button>`,html:`<label class="search">${I('Search')}<input id="library-search" aria-label="보관함 검색" placeholder="파일명·곡명 검색"></label><div class="chips">${['전체','음성','영상'].map(f=>`<button class="chip ${f===ui.mediaFilter?'active':''}" data-filter-media="${f}">${f}</button>`).join('')}</div><div class="section-head"><span id="file-count" class="muted small"></span><span class="small muted">최근 날짜순</span></div><div id="media-results" class="ui-card"></div><p class="small muted" style="margin-top:12px">이 HTML의 파일 목록은 예시 데이터예요.</p>`};},
media(id){const m=data.media.find(x=>x.id===id);if(!m)return notFound();return {title:m.kind+' 상세',nav:'library',back:'library',html:`<div class="stack"><section class="ui-card"><div class="row">${tile(m.kind==='영상'?'Video':'AudioLines')}<span class="badge neutral">${m.kind}</span></div><h2 style="font-size:22px;line-height:30px;margin:16px 0 8px">${esc(m.name)}</h2><p class="muted">${dates(m.date)} · ${m.duration}</p><div style="margin-top:20px">${btn('재생 화면 보기','preview-media:'+id,'secondary full','Play')}</div></section><section class="ui-card"><dl class="details"><dt>연결 곡</dt><dd>${link(esc(songName(m.song)),'song/'+m.song)}</dd><dt>메모</dt><dd>${esc(m.memo||'아직 메모가 없어요.')}</dd></dl></section>${btn('연습 기록에 연결','practice-song:'+m.song,'full secondary','Plus')}</div>`};},
calendar(){const first=new Date(Date.UTC(ui.year,ui.month,1)).getUTCDay(),count=new Date(Date.UTC(ui.year,ui.month+1,0)).getUTCDate(),month=`${ui.year}-${String(ui.month+1).padStart(2,'0')}`,events=data.events.filter(e=>e.date.startsWith(month));return {title:'일정',nav:'calendar',actions:plus('add-event'),html:`<div class="stack"><section class="ui-card"><div class="month-head"><button class="icon-btn" aria-label="이전 달" data-action="prev-month">${I('ChevronLeft')}</button><h2>${ui.year}년 ${ui.month+1}월</h2><button class="icon-btn" aria-label="다음 달" data-action="next-month">${I('ChevronRight')}</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<span class="weekday">${x}</span>`).join('')}${Array(first).fill('<span class="blank"></span>').join('')}${Array.from({length:count},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0');return `<button class="${date===today?'today ':''}${date===ui.selectedDate?'selected':''}" data-date="${date}" aria-label="${date}${events.some(e=>e.date===date)?' 일정 있음':''}">${i+1}${events.some(e=>e.date===date)?'<i class="event-dot"></i>':''}</button>`;}).join('')}</div></section><div class="row between"><h2 class="subhead">${dates(ui.selectedDate)} 일정</h2><button class="text-link" data-action="select-today">오늘</button></div><section class="ui-card">${events.filter(e=>e.date===ui.selectedDate).map(eventRow).join('')||empty('등록된 일정이 없어요','레슨·공연·오디션 일정을 추가해보세요.',btn('일정 추가','add-event','secondary sm'))}</section><section class="ui-card"><div class="section-head"><h2>이번 달 다가오는 일정</h2></div>${events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).map(eventRow).join('')||empty('예정된 일정이 없어요','이 달의 새 일정을 추가할 수 있어요.')}</section></div>`};},
event(id){const e=data.events.find(x=>x.id===id);if(!e)return notFound();return {title:'일정 상세',nav:'calendar',back:'calendar',html:`<div class="stack"><section class="ui-card tint"><span class="badge">${esc(e.type)}</span><h2 style="font-size:24px;margin:12px 0 8px">${esc(e.title)}</h2><p class="muted">${dates(e.date)} · ${e.time}</p></section><section class="ui-card"><dl class="details"><dt>장소</dt><dd>${esc(e.place||'미정')}</dd><dt>연결 곡</dt><dd>${e.song?link(esc(songName(e.song)),'song/'+e.song):'미지정'}</dd></dl></section>${e.type==='레슨'?btn('레슨노트 보기','go:lesson/l1','full secondary','NotebookPen'):btn('연습 기록 남기기','practice-song:'+e.song,'full secondary','History')}</div>`};},
lessons(){return {title:'레슨노트',nav:'home',actions:plus('add-lesson'),html:`<div class="stack"><section class="ui-card tint"><div class="kicker">다음 레슨</div><h2 class="subhead">11월 10일 (화) 오후 3:00</h2><p class="small muted" style="margin-top:6px">${esc(songName('s1'))} · 연습실</p>${link('레슨 상세','lesson/l1')}</section><section class="ui-card"><div class="section-head"><h2>지난 레슨</h2><span class="small muted">${data.lessons.filter(l=>l.status==='완료').length}개</span></div>${data.lessons.filter(l=>l.status==='완료').map(l=>row(l.title,dates(l.date)+' · '+songName(l.song),'lesson/'+l.id,'NotebookPen')).join('')||empty('첫 레슨노트를 남겨보세요','피드백과 숙제를 한곳에 모을 수 있어요.')}</section>${btn('숙제 모아보기','go:homework','full quiet','ListChecks')}</div>`};},
lesson(id){const l=findLesson(id);if(!l)return notFound();return {title:'레슨 상세',nav:'home',back:'lessons',actions:`<button class="icon-btn" aria-label="레슨노트 편집" data-action="edit-note" data-id="${id}">${I('Pencil')}</button>`,html:`<div class="stack"><section class="ui-card tint"><span class="badge">${l.status}</span><h2 style="font-size:22px;line-height:30px;margin:12px 0 8px">${esc(l.title)}</h2><p class="muted">${dates(l.date)} · ${l.time}</p><p class="small muted" style="margin-top:6px">${esc(l.teacher)} · ${esc(l.place)}</p></section><section class="ui-card"><div class="section-head"><h2>연습 곡</h2></div>${row(songName(l.song),findSong(l.song)?.artist||'','song/'+l.song,'Music2')}</section><section class="ui-card"><div class="section-head"><h2>레슨 피드백</h2><button class="text-link" data-action="edit-note" data-id="${id}">편집</button></div><p class="note-text">${esc(l.note||'레슨이 끝나면 피드백을 남겨보세요.')}</p></section><section class="ui-card"><div class="section-head"><h2>연습 숙제</h2>${link('전체','homework')}</div>${taskRows(data.tasks.filter(t=>t.source==='숙제'))}</section></div>`};},
practice(id){if(id){const p=data.practices.find(x=>x.id===id);if(!p)return notFound();return {title:'연습 상세',nav:'home',back:'practice',html:`<div class="stack"><section class="ui-card tint"><div class="kicker">${dates(p.date)} · ${p.type}</div><h2 style="font-size:22px;line-height:30px">${esc(songName(p.song))}</h2><div class="big-number" style="margin-top:16px">${p.minutes}<small> 분</small></div></section><section class="ui-card"><div class="section-head"><h2>연습 메모</h2></div><p class="note-text">${esc(p.memo||'남긴 메모가 없어요.')}</p></section>${p.song?btn('곡 상세 보기','go:song/'+p.song,'secondary full','Music2'):''}</div>`};}return {title:'연습기록',nav:'home',actions:plus('add-practice'),html:`<div class="stack"><section class="ui-card"><div class="section-head"><h2>최근 기록</h2><span class="small muted">${data.practices.length}개</span></div><div class="mini-stats"><div><strong>${data.practices.reduce((a,p)=>a+p.minutes,0)}</strong><span>기록된 연습(분)</span></div><div><strong>${new Set(data.practices.map(p=>p.date)).size}</strong><span>연습한 날</span></div><div><strong>${new Set(data.practices.map(p=>p.song).filter(Boolean)).size}</strong><span>연습한 곡</span></div></div></section><section class="ui-card">${data.practices.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>row(songName(p.song),dates(p.date)+' · '+p.type,'practice/'+p.id,p.song?'Music2':'Wind',`<span class="badge neutral">${p.minutes}분</span>`)).join('')}</section>${btn('성장 기록 보기','go:growth','full quiet','ChartNoAxesColumnIncreasing')}</div>`};},
homework(){const tasks=data.tasks.filter(t=>ui.hwFilter==='완료'?t.done:!t.done);return {title:'숙제와 목표',nav:'home',actions:plus('add-task'),html:`<div class="tabs">${['진행 중','완료'].map(x=>`<button class="${x===ui.hwFilter?'active':''}" data-filter-task="${x}">${x}</button>`).join('')}</div><section class="ui-card">${tasks.length?taskRows(tasks):empty('이 목록에 목표가 없어요','새 목표를 추가하거나 다른 탭을 확인해보세요.')}</section><div class="note neutral" style="margin-top:12px">체크 상태는 이 시안을 열어둔 동안만 유지돼요.</div>`};},
record(){return {title:'녹음',nav:'',hideNav:true,html:`<div class="stack"><div class="note neutral">녹음 흐름을 확인하는 시안이에요. 마이크를 사용하거나 실제 음성을 저장하지 않아요.</div><section class="ui-card"><label class="field"><span>연결 곡</span><select id="record-song">${data.songs.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></label><div class="record-body"><div class="record-icon">${I('Mic')}</div><div id="record-clock" class="record-clock">${clock(seconds)}</div><div id="record-status" class="record-status">${recordStatus()}</div><div id="record-controls" class="record-controls">${recordControls()}</div></div></section><div class="record-demo">시안 모드 · 실제 녹음 없음</div>${link('보관함 보기','library')}</div>`};},
growth(){const max=Math.max(...data.practices.map(p=>p.minutes),1);return {title:'성장 기록',nav:'home',html:`<div class="stack"><section class="ui-card"><div class="section-head"><h2>최근 연습 시간</h2></div><div class="big-number">${data.practices.reduce((a,p)=>a+p.minutes,0)}<small> 분</small></div><div class="week-bars">${data.practices.slice().reverse().map(p=>`<div><b style="height:${Math.round(p.minutes/max*66)+8}px"></b><span>${p.date.slice(5).replace('-','/')}</span></div>`).join('')}</div></section><section class="ui-card"><div class="section-head"><h2>곡별 연습</h2></div>${data.songs.map(s=>{const p=data.practices.filter(x=>x.song===s.id);return row(s.title,`${p.length}번 기록 · ${p.reduce((a,x)=>a+x.minutes,0)}분`,'song/'+s.id,'Music2');}).join('')}</section></div>`};},
settings(){return {title:'내 설정',nav:'home',html:`<div class="stack"><section class="ui-card"><div class="row">${tile('UserRound')}<div><h2 class="subhead">유리님</h2><p class="small muted">개인 연습 공간 · 예시 프로필</p></div></div></section><section class="ui-card"><div class="section-head"><h2>연습 목표</h2></div><form id="target-form">${field('일 목표(분)','daily','number','30')}${field('주 목표(분)','weekly','number','180')}<button class="btn secondary full" type="submit">목표 설정 확인</button></form></section><section class="ui-card"><div class="settings-row"><span>레슨 알림</span><input class="switch" type="checkbox" aria-label="레슨 알림" checked></div><div class="settings-row"><span>연습 리마인더</span><input class="switch" type="checkbox" aria-label="연습 리마인더"></div></section><section class="ui-card">${row('디자인 시스템','색상·글자·컴포넌트 규격','design-system','Palette')}</section><p class="small muted">설정은 시안 안에서만 확인되며 실제 계정에 저장되지 않아요.</p></div>`};},
notifications(){return {title:'알림',nav:'home',html:`<section class="ui-card">${data.notifications.map((n,i)=>`<button class="list-row" data-action="read-notification" data-id="${i}">${tile('Bell')}<span class="grow"><span class="title">${esc(n.title)}</span><span class="desc">${esc(n.desc)}</span></span>${!n.read?'<span class="badge">새 알림</span>':''}</button>`).join('')}</section>`};},
'design-system'(){const colors=[['포인트','#7A32F5'],['눌림','#6528CA'],['연한 면','#F3ECFF'],['페이지','#F8F6FD'],['제목','#101828'],['본문','#475467'],['설명','#667085'],['미달','#D9C5FA'],['초과','#4C188E'],['경계선','#EAECF0']];return {title:'디자인 시스템',nav:'home',back:'settings',html:`<div class="stack"><section class="ui-card tint"><h2 class="subhead">Vocalzip · Soft Lavender</h2><p class="body-copy" style="margin-top:8px">정돈된 정보 위계와 가벼운 카드.<br>녹음은 네비 위 플로팅 액션으로.</p></section><section class="ui-card"><div class="section-head"><h2>색상</h2></div><div class="ds-colors">${colors.map(([n,c])=>`<div class="color-swatch"><b style="background:${c}"></b><strong>${n}</strong><code>${c}</code></div>`).join('')}</div></section><section class="ui-card"><div class="section-head"><h2>Pretendard</h2></div>${[['화면 제목','22px / 32px · 700',22,700],['카드 제목','18px / 26px · 700',18,700],['기능·곡명','16px / 24px · 600',16,600],['본문','15px / 23px · 400',15,400],['날짜·설명','13px / 20px · 400',13,400],['배지·보조','11px / 16px · 600',11,600]].map(([n,d,size,w])=>`<div class="ds-type-row"><span style="font-size:${size}px;font-weight:${w}">${n}</span><small>${d}</small></div>`).join('')}</section><section class="ui-card"><div class="section-head"><h2>버튼</h2></div><div class="stack">${btn('기본 버튼 · 52px','ds-demo','full')}${btn('보조 버튼 · 52px','ds-demo','full secondary')}${btn('작은 버튼 · 44px','ds-demo','quiet sm')}${btn('녹음 시작 · 48px','go:record','gradient','Mic')}<button class="btn full" disabled>비활성</button></div></section><section class="ui-card"><div class="section-head"><h2>필드와 상태</h2></div>${field('라벨','ds-example','text','','보조 설명은 12px 회색으로 표시해요.')}<label class="field"><span>오류 상태</span><input class="field-error" value="" placeholder="연습 시간"><span class="hint error">연습 시간을 1분 이상 입력해주세요.</span></label><label class="option-row"><input type="checkbox" checked>완료 체크</label><label class="option-row"><input type="checkbox">미완료 체크</label><div class="tag-line"><span class="badge">진행 중</span><span class="badge good">완료</span><span class="badge neutral">숙제</span></div></section><section class="ui-card"><div class="section-head"><h2>공통 치수</h2></div><dl class="details"><dt>카드</dt><dd>모서리20 · 내부20 · 간격12px</dd><dt>아이콘</dt><dd>제목20 · 네비24px · 선1.8px</dd><dt>터치</dt><dd>최소44×44px</dd><dt>네비</dt><dd>높이70px · 흰색78% · 블러20px</dd><dt>녹음</dt><dd>높이48px · 네비 위12px · 고정</dd></dl></section><section class="ui-card">${empty('빈 상태 예시','짧은 설명과 필요한 다음 행동 하나를 보여줘요.',btn('다시 확인','ds-demo','secondary sm'))}</section></div>`};}
};
function notFound(){return {title:'찾을 수 없는 화면',nav:'home',html:empty('화면을 찾지 못했어요','홈에서 다시 시작할 수 있어요.',btn('홈으로','go:home','secondary sm'))};}
function eventRow(e){return row(e.title,dates(e.date)+' · '+e.time+' · '+e.type,'event/'+e.id,e.type==='레슨'?'NotebookPen':e.type==='공연'?'Drama':'Mic');}
function taskRows(tasks){return tasks.map(t=>`<label class="option-row" style="justify-content:space-between"><span class="row"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span style="${t.done?'color:#98A2B3;text-decoration:line-through':''}">${esc(t.title)}</span></span><span class="badge neutral">${t.source}</span></label>`).join('');}
function render(){const [key='home',id]=route();const page=(routes[key]||notFound)(id);$('#app-header').innerHTML=page.home?`<a class="wordmark" href="#/home">${I('AudioLines')}Vocalzip</a><div class="header-actions"><a class="icon-btn" aria-label="알림" href="#/notifications">${I('Bell')}</a><a class="icon-btn" aria-label="내 설정" href="#/settings">${I('UserRound')}</a></div>`:header(page.title,page.back||'home',page.actions);$('#app-main').innerHTML=page.html;document.title=page.title+' · Vocalzip';$('#record-fab').hidden=key==='record';$('#app-nav-space').hidden=!!page.hideNav;$$('#app-nav .vz-nav-item').forEach(a=>{const active=a.dataset.nav===page.nav;a.classList.toggle('vz-active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(key==='home')wireHome();if(key==='songs'){$('#songs-search').addEventListener('input',drawSongs);drawSongs();}if(key==='library'){$('#library-search').addEventListener('input',drawMedia);drawMedia();}if(key==='settings')$('#target-form').onsubmit=e=>{e.preventDefault();toast('시안에서 확인했어요. 실제 목표는 변경되지 않아요.');};}
function wireHome(){const tasks=$$('.vz-goal-list label');tasks.forEach((label,i)=>{const input=label.querySelector('input');input.checked=data.tasks[i].done;input.dataset.task=data.tasks[i].id;});$('.vz-count').textContent=data.tasks.filter(t=>t.done).length+' / 3 완료';$('.vz-header')?.remove();$('.vz-song .vz-play')?.setAttribute('data-action','practice-song:s1');$$('.vz-shortcut').forEach((b,i)=>b.setAttribute('data-action','go:'+(i?'practice':'lessons')));$('.vz-goal-tools button')?.setAttribute('data-action','go:homework');$('.vz-week .vz-title')?.setAttribute('data-action','go:growth');$('.vz-week .vz-title')?.setAttribute('role','link');$('.vz-week .vz-title')?.setAttribute('tabindex','0');$('.vz-event')?.setAttribute('data-action','go:lesson/l1');$('.vz-event')?.setAttribute('role','link');$('.vz-event')?.setAttribute('tabindex','0');$$('.vz-event-row').forEach((b,i)=>b.setAttribute('data-action','go:event/'+(i?'e3':'e2')));}
function drawSongs(){const q=$('#songs-search').value.trim().toLowerCase(),items=data.songs.filter(s=>(ui.songsFilter==='전체'||s.status===ui.songsFilter)&&(!q||(s.title+' '+s.artist).toLowerCase().includes(q)));$('#songs-results').innerHTML=items.length?items.map(s=>row(s.title,s.artist+' · '+s.status,'song/'+s.id,'Music2')).join(''):empty('조건에 맞는 곡이 없어요','검색어나 필터를 바꿔보세요.');}
function drawMedia(){const q=$('#library-search').value.trim().toLowerCase(),items=data.media.filter(m=>(ui.mediaFilter==='전체'||m.kind===ui.mediaFilter)&&(!q||(m.name+' '+songName(m.song)).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));$('#file-count').textContent=items.length+'개 파일';$('#media-results').innerHTML=items.length?items.map(m=>row(m.name,dates(m.date)+' · '+m.duration,'media/'+m.id,m.kind==='영상'?'Video':'AudioLines')).join(''):empty('조건에 맞는 파일이 없어요','검색어나 파일 종류를 바꿔보세요.');}
function addSong(id){const s=findSong(id)||{};formSheet(id?'곡 수정':'새 곡 추가',field('곡명','title','text',s.title||'')+field('가수·작품명','artist','text',s.artist||'')+`<div class="two"><label class="field"><span>종류</span><select name="type"><option>뮤지컬</option><option>팝</option><option>가요</option></select></label><label class="field"><span>상태</span><select name="status"><option>연습 중</option><option ${s.status==='보관'?'selected':''}>보관</option></select></label></div><label class="field"><span>연습 메모</span><textarea name="memo">${esc(s.memo||'')}</textarea></label>`,f=>{const title=String(f.get('title')).trim();if(!title){toast('곡명을 입력해주세요.');return false;}const v={title,artist:String(f.get('artist')).trim(),type:f.get('type'),status:f.get('status'),memo:String(f.get('memo')),last:today};if(id)Object.assign(s,v);else data.songs.unshift({id:'s'+Date.now(),key:'',...v});render();toast('시안에 곡을 저장했어요.');});}
function addPractice(sid='s1'){formSheet('연습 기록',songSelect(sid,true)+`<label class="field"><span>연습 종류</span><select name="type"><option>곡 연습</option><option>보컬 트레이닝</option></select></label><div class="two">${field('날짜','date','date',today)}${field('연습 시간(분)','minutes','number','30')}</div><label class="field"><span>연습 메모</span><textarea name="memo" placeholder="오늘 연습한 내용과 느낌을 남겨보세요."></textarea></label>`,f=>{const n=Number(f.get('minutes'));if(!Number.isFinite(n)||n<1||n>1440){toast('연습 시간은 1~1440분으로 입력해주세요.');return false;}data.practices.unshift({id:'p'+Date.now(),song:f.get('song'),type:f.get('type'),date:f.get('date'),minutes:n,memo:String(f.get('memo'))});if(route()[0]==='practice')render();toast('시안에 연습 기록을 남겼어요.');});}
function addEvent(isLesson=false){formSheet(isLesson?'레슨 일정 추가':'일정 추가',`<label class="field"><span>일정 종류</span><select name="type"><option>레슨</option><option>공연</option><option>오디션</option></select></label>`+field('일정명','title','text',isLesson?'보컬 레슨':'')+`<div class="two">${field('날짜','date','date',ui.selectedDate||today)}${field('시간','time','time','15:00')}</div>`+field('장소','place','text','연습실')+songSelect('s1',true),f=>{const id='e'+Date.now(),e={id,title:String(f.get('title')).trim(),type:f.get('type'),date:f.get('date'),time:f.get('time'),place:String(f.get('place')),song:f.get('song')};if(!e.title){toast('일정명을 입력해주세요.');return false;}data.events.push(e);if(isLesson)data.lessons.unshift({id:'l'+Date.now(),...e,status:'예정',teacher:'보컬 선생님',note:''});const d=new Date(e.date+'T12:00:00Z');ui.year=d.getUTCFullYear();ui.month=d.getUTCMonth();ui.selectedDate=e.date;go('calendar');toast('시안에 일정을 추가했어요.');});}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function recordStatus(){return {idle:'준비되면 시작해보세요',recording:'녹음 중 · 시뮬레이션',paused:'잠시 멈췄어요',stopped:'녹음 흐름 확인 완료'}[recordState];}
function recordControls(){return recordState==='idle'?btn('녹음 시작','record-start','gradient','Mic'):recordState==='stopped'?btn('다시 시작','record-reset','quiet','RotateCcw')+btn('기록 남기기','record-save','','Check'):btn(recordState==='paused'?'계속':'일시정지','record-pause','quiet',recordState==='paused'?'Play':'Pause')+btn('종료','record-stop','','Square');}
function updateRecorder(){if($('#record-clock')){$('#record-clock').textContent=clock(seconds);$('#record-status').textContent=recordStatus();$('#record-controls').innerHTML=recordControls();}}
function action(name,id){if(name.startsWith('go:')){go(name.slice(3));return;}if(name.startsWith('practice-song:')){addPractice(name.slice(14));return;}if(name.startsWith('preview-media:')){const m=data.media.find(x=>x.id===name.slice(14));previewSheet('재생 미리보기',`<div class="record-body">${tile(m?.kind==='영상'?'Video':'AudioLines')}<h3 style="margin-top:16px">${esc(m?.name)}</h3><p class="muted" style="margin-top:8px">${m?.duration||''}</p></div><p class="note neutral">예시 파일의 상세 화면이에요. 실제 미디어 파일은 포함하지 않았어요.</p>`);return;}
switch(name){case'close-sheet':$('#app-dialog').close();break;case'add-song':addSong();break;case'edit-song':addSong(id);break;case'add-practice':addPractice();break;case'add-event':addEvent();break;case'add-lesson':addEvent(true);break;case'add-task':formSheet('목표 추가',field('목표 내용','title'),f=>{const title=String(f.get('title')).trim();if(!title)return false;data.tasks.push({id:'t'+Date.now(),title,source:'개인',done:false});render();toast('시안에 목표를 추가했어요.');});break;
case'edit-note':{const l=findLesson(id);formSheet('레슨 피드백 편집',`<label class="field"><span>피드백</span><textarea name="note" rows="8">${esc(l.note)}</textarea></label>`,f=>{l.note=String(f.get('note'));render();toast('시안에 피드백을 남겼어요.');});break;}
case'import':formSheet('파일 가져오기',`<p class="sheet-sub">파일은 서버에 전송되지 않아요. 시안 목록에 이름만 추가해요.</p><label class="field"><span>음성·영상 선택</span><input name="file" type="file" accept="audio/*,video/*" required></label>`+songSelect('s1',true),f=>{const file=f.get('file');if(!file?.name){toast('파일을 선택해주세요.');return false;}data.media.unshift({id:'m'+Date.now(),name:file.name,song:f.get('song'),date:today,duration:'길이 미확인',kind:file.type.startsWith('video/')?'영상':'음성',memo:'기기에서 선택한 파일 이름만 표시한 시안 항목'});drawMedia();toast('시안 목록에 파일 이름을 추가했어요.');});break;
case'prev-month':ui.month--;if(ui.month<0){ui.month=11;ui.year--;}ui.selectedDate=ui.year+'-'+String(ui.month+1).padStart(2,'0')+'-01';render();break;case'next-month':ui.month++;if(ui.month>11){ui.month=0;ui.year++;}ui.selectedDate=ui.year+'-'+String(ui.month+1).padStart(2,'0')+'-01';render();break;case'select-today':ui.year=2026;ui.month=10;ui.selectedDate=today;render();break;
case'read-notification':data.notifications[Number(id)].read=true;render();break;case'ds-demo':toast('컴포넌트 동작 예시예요.');break;
case'record-start':recordState='recording';seconds=0;timer=setInterval(()=>{if(recordState==='recording'){seconds++;updateRecorder();}},1000);updateRecorder();break;case'record-pause':recordState=recordState==='paused'?'recording':'paused';updateRecorder();break;case'record-stop':recordState='stopped';clearInterval(timer);updateRecorder();break;case'record-reset':recordState='idle';seconds=0;clearInterval(timer);updateRecorder();break;case'record-save':addPractice($('#record-song').value);break;
}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();action(a.dataset.action,a.dataset.id);}const sf=e.target.closest('[data-filter-song]');if(sf){ui.songsFilter=sf.dataset.filterSong;render();}const mf=e.target.closest('[data-filter-media]');if(mf){ui.mediaFilter=mf.dataset.filterMedia;render();}const tf=e.target.closest('[data-filter-task]');if(tf){ui.hwFilter=tf.dataset.filterTask;render();}const day=e.target.closest('[data-date]');if(day){ui.selectedDate=day.dataset.date;render();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=link][data-action]')){e.preventDefault();action(e.target.dataset.action);}});
document.addEventListener('change',e=>{if(e.target.matches('[data-task]')){const t=data.tasks.find(t=>t.id===e.target.dataset.task);if(t){t.done=e.target.checked;if(route()[0]==='home')$('.vz-count').textContent=data.tasks.slice(0,3).filter(x=>x.done).length+' / 3 완료';else render();}}});
$('#record-fab').addEventListener('click',()=>go('record'));
$('#app-dialog').addEventListener('click',e=>{if(e.target===$('#app-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
window.addEventListener('hashchange',()=>{if(route()[0]!=='record'){clearInterval(timer);recordState='idle';seconds=0;}if($('#app-dialog').open)$('#app-dialog').close();render();window.scrollTo(0,0);});
if(!location.hash)location.hash='/home';else render();
})();
