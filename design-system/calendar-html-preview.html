<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vocalzip 일정 시안</title>
<link rel="stylesheet" href="../vendor/phosphor/style.css"><link rel="stylesheet" href="student-home-fonts.css">
<style>
:root{--purple:#7A32F5;--ink:#101828;--body:#475467;--muted:#667085;--page:#F8F6FD;--orange:#C43D18;--teal:#007E88;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--page);font-size:14px;letter-spacing:-.02em}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:2px}button i,a i{font-size:20px;font-style:normal}main{width:min(100%,560px);margin:auto;padding:max(8px,env(safe-area-inset-top)) 12px calc(150px + env(safe-area-inset-bottom))}.header{height:52px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.header h1{font-size:26px;line-height:34px;margin:0;font-weight:700}.header-actions{display:flex;gap:4px}.icon-btn{display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:#667085}

.calendar{padding:16px 14px 12px}.month-head{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:7px}.month-head strong{font-size:18px}.month-btn{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:radial-gradient(circle,#F2F4F7 0 16px,transparent 16.5px);color:var(--body)}.month-btn i{font-size:18px}.weekdays,.dates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{height:30px;align-items:center;color:var(--body);font-size:12px}.weekdays span:first-child{color:#CE362C}.dates{grid-auto-rows:38px;align-items:center}.day{width:36px;height:36px;position:relative;justify-self:center;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#344054;font-size:14px;font-weight:600}.day.outside{color:#B6BBC8}.day.selected{color:white;background:var(--purple)}.day.today{outline:2px solid var(--purple);outline-offset:3px}.day[data-dots]:after{content:"";width:4px;height:4px;position:absolute;bottom:3px;border-radius:50%;background:var(--teal)}.day.selected[data-dots]:after{background:#fff;box-shadow:6px 0 #fff;left:calc(50% - 5px)}.legend{min-height:44px;display:flex;gap:12px;align-items:center;color:var(--body);font-size:12px;white-space:nowrap}.legend span{display:flex;align-items:center;gap:4px}.legend em{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--orange)}.legend .lesson em{background:var(--purple)}.legend .practice em{background:#009BA6}.today-btn{margin-left:auto;border:0;border-radius:12px;background:#F3ECFF;color:var(--purple);min-height:36px;padding:0 11px;font-weight:600}
.date-head{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 4px}.date-head h2{font-size:18px;margin:0}.date-head button{border:0;background:none;color:var(--body);width:44px;height:44px}.date-head button i{font-size:22px}.group{margin-bottom:12px}.group-label{height:48px;border-radius:16px;display:flex;align-items:center;padding:0 14px;font-size:13px;font-weight:600}.group.stage .group-label{background:#FFF0E9;color:var(--orange)}.group.lesson .group-label{background:#F3ECFF;color:var(--purple)}.group.practice .group-label{background:#E7F5F5;color:var(--teal)}.items{display:grid;gap:12px;margin-top:6px}.item{min-height:86px;border-radius:20px;padding:16px;display:flex;align-items:center;gap:12px;background:white;color:var(--ink);text-decoration:none}.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:22px}.stage .avatar{background:#FFF0E9;color:var(--orange)}.lesson .avatar{background:#F3ECFF;color:var(--purple)}.practice .avatar{background:#E7F5F5;color:var(--teal)}.item-text{flex:1;min-width:0}.item strong{display:block;font-size:15px;line-height:21px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{display:block;color:var(--muted);font-size:12px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item>.ph{font-size:17px;color:#98A2B3}.empty{padding:16px;color:var(--muted);font-size:13px}
.dock{position:fixed;z-index:10;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),528px);height:70px;padding:8px;border-radius:99px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.68);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 5px 20px #3721550b}.dock a{text-decoration:none;border-radius:99px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7D748A;font-size:11px}.dock a i{font-size:22px;color:var(--body)}.dock a.active{background:#EDE1FF;color:#8A6DB8}.dock a.active i{color:var(--purple)}.record{position:fixed;z-index:11;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 82px);width:52px;height:52px;display:grid;place-items:center;border:0;border-radius:50%;background:linear-gradient(135deg,#9557FF,#7A32F5 52%,#6D2BE5);color:white;box-shadow:0 5px 14px #6d2be52e}.record i{font-size:22px}
@media(max-width:350px){.legend{gap:7px;font-size:11px}.calendar{padding-inline:10px}.item{padding:12px}}
</style></head><body><main>
<header class="header"><h1>일정</h1><div class="header-actions"><button class="icon-btn" aria-label="일정 목록"><i class="ph ph-list-bullets"></i></button><button class="icon-btn" aria-label="설정"><i class="ph ph-gear-six"></i></button></div></header>
<section class="summary" aria-label="월간 연습"><div class="summary-head"><strong id="summary-month">11월 연습</strong><b id="summary-total">42분 · 2회</b></div><button class="ticker" id="ticker" aria-label="연습곡 순위, 좌우로 넘겨 기준 전환"><span class="rank" id="rank">시간별 1위</span><span class="song" id="song">Defying Gravity</span><span class="metric" id="metric">24분</span></button></section>
<section class="calendar" aria-label="월간 달력"><div class="month-head"><button class="month-btn" id="prev" aria-label="이전 달"><i class="ph ph-caret-left"></i></button><strong id="month-title"></strong><button class="month-btn" id="next" aria-label="다음 달"><i class="ph ph-caret-right"></i></button></div><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="dates" id="dates"></div><div class="legend"><span><em></em>공연·오디션</span><span class="lesson"><em></em>레슨</span><span class="practice"><em></em>연습</span><button class="today-btn" id="today">오늘</button></div></section>
<section aria-label="선택한 날짜의 일정"><div class="date-head"><h2 id="date-title"></h2><button id="add" aria-label="선택한 날짜에 일정 추가"><i class="ph ph-plus"></i></button></div><div id="agenda"></div></section>
</main><button class="record" aria-label="녹음 시작" onclick="location.href='../index.html#/record'"><i class="ph ph-microphone"></i></button><nav class="dock" aria-label="주요 메뉴"><a href="../index.html#/home"><i class="ph ph-house"></i>홈</a><a href="../index.html#/songs"><i class="ph ph-music-notes"></i>내 곡</a><a href="../index.html#/library"><i class="ph ph-archive-box"></i>보관함</a><a href="../index.html#/calendar" class="active" aria-current="page"><i class="ph ph-calendar-blank"></i>일정</a></nav>
<script>
const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,localToday=()=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(+p.year,+p.month-1,+p.day)};
let selected=localToday(),month=new Date(selected.getFullYear(),selected.getMonth(),1);const demoDate='2026-11-09';const entries=[{kind:'stage',date:demoDate,title:'14:00  뮤지컬 오디션',sub:'위키드 · 공연장',icon:'ticket'},{kind:'lesson',date:demoDate,title:'19:00–20:00  보컬 레슨',sub:'보컬스튜디오 · Defying Gravity · 피드백 미작성',icon:'notebook'},{kind:'practice',date:demoDate,title:'Defying Gravity',sub:'24분',icon:'timer'}];const kinds=[['stage','공연·오디션'],['lesson','레슨'],['practice','연습']];const $=id=>document.getElementById(id);
function draw(){const today=key(localToday());$('month-title').textContent=`${month.getFullYear()}년 ${month.getMonth()+1}월`;$('summary-month').textContent=`${month.getMonth()+1}월 연습`;const sampleMonth=month.getFullYear()===2026&&month.getMonth()===10;$('summary-total').textContent=sampleMonth?'42분 · 2회':'0분 · 0회';$('ticker').hidden=!sampleMonth;$('dates').replaceChildren();const start=new Date(month);start.setDate(1-start.getDay());const last=new Date(month.getFullYear(),month.getMonth()+1,0);const count=Math.ceil((month.getDay()+last.getDate())/7)*7;for(let i=0;i<count;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.className='day'+(d.getMonth()===month.getMonth()?'':' outside')+(key(d)===key(selected)?' selected':'')+(key(d)===today?' today':'');b.textContent=d.getDate();b.setAttribute('aria-label',`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`);if(key(d)===today)b.setAttribute('aria-current','date');if(entries.some(e=>e.date===key(d)))b.dataset.dots='true';b.onclick=()=>{selected=d;month=new Date(d.getFullYear(),d.getMonth(),1);draw()};$('dates').append(b)}$('date-title').textContent=`${selected.getMonth()+1}월 ${selected.getDate()}일 (${['일','월','화','수','목','금','토'][selected.getDay()]})`;const agenda=$('agenda');agenda.replaceChildren();let any=false;for(const [kind,label] of kinds){const rows=entries.filter(e=>e.kind===kind&&e.date===key(selected));if(!rows.length)continue;any=true;const section=document.createElement('section');section.className=`group ${kind}`;const bar=document.createElement('div');bar.className='group-label';bar.textContent=label;section.append(bar);const list=document.createElement('div');list.className='items';for(const e of rows){const a=document.createElement('a');a.className='item';a.href='../index.html#/calendar';a.innerHTML=`<span class="avatar"><i class="ph ph-${e.icon}"></i></span><span class="item-text"><strong></strong><small></small></span><i class="ph ph-caret-right" aria-hidden="true"></i>`;a.querySelector('strong').textContent=e.title;a.querySelector('small').textContent=e.sub;list.append(a)}section.append(list);agenda.append(section)}if(!any){const p=document.createElement('p');p.className='empty';p.textContent='이 날 등록된 일정과 연습 기록이 없어요.';agenda.append(p)}}$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);selected=new Date(month);draw()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);selected=new Date(month);draw()};$('today').onclick=()=>{selected=localToday();month=new Date(selected.getFullYear(),selected.getMonth(),1);draw()};$('add').onclick=()=>{location.href='../index.html#/calendar'};
const scores={시간:[['Defying Gravity','24분'],['지금 이 순간','12분'],['Popular','6분'],['For Good','5분'],['On My Own','3분']],횟수:[['Defying Gravity','2회'],['Popular','1회'],['지금 이 순간','1회'],['For Good','1회'],['On My Own','1회']]};let type='시간',position=0;function rank(){const [song,value]=scores[type][position];$('rank').textContent=`${type}별 ${position+1}위`;$('song').textContent=song;$('metric').textContent=value}function flip(){type=type==='시간'?'횟수':'시간';position=0;rank()}let touch=0,swiped=false;$('ticker').onclick=()=>{if(swiped){swiped=false;return}flip()};$('ticker').addEventListener('touchstart',e=>{touch=e.touches[0].clientX;swiped=false},{passive:true});$('ticker').addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].clientX-touch)>35){swiped=true;flip();setTimeout(()=>swiped=false,500)}},{passive:true});setInterval(()=>{if(document.hidden||document.activeElement===$('ticker')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;position=(position+1)%scores[type].length;rank()},3500);rank();draw();
</script></body></html>
