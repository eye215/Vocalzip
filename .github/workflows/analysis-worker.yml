# VOCAL.zip server analysis worker: analyzes new recordings and sorts them into songs after upload, even
# when the app is closed. Free on GitHub-hosted runners for this public repository.
# Needs repository secrets (Settings → Secrets and variables → Actions); without SUPABASE_DB_URL it does nothing:
#   SUPABASE_DB_URL        Supabase → Connect → Session pooler URI (IPv4), with the database password
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   Cloudflare R2 API token, Object Read only
#   OPENAI_API_KEY         for song identification (without it only the vocal measurements run)
#   SUPABASE_SERVICE_ROLE_KEY   optional: older recordings still kept in Supabase Storage
# Logs show counts only (this repository is public).
name: Analysis worker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      max_jobs:
        description: 'How many jobs at most (1 = single-file check)'
        default: ''
      kinds:
        description: 'vocal, song or both (empty = both)'
        default: ''
      verbose:
        description: 'Log each step (sizes and statuses only)'
        type: boolean
        default: false
      requeue_network_failures:
        description: 'Queue again the jobs that failed only because the file could not be reached'
        type: boolean
        default: false
  repository_dispatch:
    types: [analyze]
permissions:
  contents: read
concurrency:
  group: analysis-worker
  cancel-in-progress: false
jobs:
  work:
    if: github.repository == 'eye215/Vocalzip'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Anything waiting?
        id: peek
        run: node worker/analysis-worker.mjs --peek
      # A pinned prebuilt ffmpeg (npm ffmpeg-static), cached between runs: apt mirrors once took 38 minutes.
      - name: Cache ffmpeg
        if: (steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-5.2.0-${{ runner.os }}
      - name: Install ffmpeg
        if: (steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures
        timeout-minutes: 8
        run: |
          if [ ! -x ~/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg ]; then
            npm install --prefix ~/ffmpeg-static --no-save --no-audit --no-fund ffmpeg-static@5.2.0 || true
          fi
          if [ -x ~/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg ]; then
            echo "FFMPEG_PATH=$HOME/ffmpeg-static/node_modules/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
          else
            command -v ffmpeg || timeout 300 sudo apt-get install -y -q --no-install-recommends ffmpeg
          fi
      - name: Analyze
        if: (steps.peek.outputs.jobs != '' && steps.peek.outputs.jobs != '0') || inputs.requeue_network_failures
        timeout-minutes: 48
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_MAX_JOBS: ${{ inputs.max_jobs }}
          WORKER_KINDS: ${{ inputs.kinds }}
          WORKER_VERBOSE: ${{ inputs.verbose && '1' || '' }}
          WORKER_REQUEUE_NETWORK: ${{ inputs.requeue_network_failures && '1' || '' }}
        run: node worker/analysis-worker.mjs
