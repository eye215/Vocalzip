name: GoodNotes import checks
on:
  pull_request:
    paths:
      - 'app/goodnotes-*.js'
      - 'app/scores.js'
      - 'app/score-ink-model.js'
      - 'app/score-ink.js'
      - 'tests/goodnotes-*'
      - '.github/workflows/goodnotes-import-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goodnotes-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  goodnotes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: node --test tests/goodnotes-parse.test.cjs
      - name: Pinned PDF libraries for the browser import test
        run: npm install --prefix /tmp/vzip-score-pdfjs --ignore-scripts --omit=optional pdfjs-dist@4.10.38 pdf-lib@1.17.1
      - run: npx playwright test tests/goodnotes-import.spec.cjs --workers=2
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
