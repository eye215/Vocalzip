name: Media deletion unchanged-main upload baseline
on:
  push:
    branches: ['codex/media-delete-baseline-eca9b0d3149a']
permissions:
  contents: read
jobs:
  existing-minimum-duration-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'eca9b0d3149a81fc2495b53dcd30beba25454cca'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Existing bulk-upload test without any media-deletion changes
        run: npx playwright test tests/v6.spec.cjs --project=chromium-desktop --grep 'Bulk upload: one file at a time' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-main-minimum-duration
          path: |
            test-results/
            playwright-report/
