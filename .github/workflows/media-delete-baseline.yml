name: Delete resume unchanged-main upload baseline
on:
  push:
    branches: ['codex/delete-resume-upload-baseline-3e62b954ec47']
permissions:
  contents: read
jobs:
  existing-minimum-duration-case:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '3e62b954ec473387b74c40153e8e4cc482b24808'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Existing bulk-upload test without any media-deletion changes
        run: >-
          npx playwright test tests/v6.spec.cjs --project=chromium-desktop --grep 'Bulk upload: one file at a time' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unchanged-main-minimum-duration
          path: |
            test-results/
            playwright-report/
