name: Field draft server checks
on:
  pull_request:
    paths:
      - 'supabase/proposals/**'
      - 'tests/field-drafts.test.mjs'
      - 'tests/snapshot-revision.test.mjs'
      - '.github/workflows/field-drafts-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drafts-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drafts_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Snapshot compatibility and field transactions in disposable PostgreSQL
        env:
          VZ_SNAPSHOT_TEST_DB: postgres://postgres:drafts_ci_only@localhost:5432/postgres
          VZ_DRAFT_TEST_DB: postgres://postgres:drafts_ci_only@localhost:5432/postgres
        run: node --test --test-concurrency=1 tests/snapshot-revision.test.mjs tests/field-drafts.test.mjs
