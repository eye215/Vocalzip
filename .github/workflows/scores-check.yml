name: Score upload checks
on:
  pull_request:
    paths:
      - 'app/scores.js'
      - 'tests/scores.spec.cjs'
      - '.github/workflows/scores-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scores:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/scores.spec.cjs --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-upload-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
