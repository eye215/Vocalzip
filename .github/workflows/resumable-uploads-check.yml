name: Resumable R2 upload checks
on:
  push:
    branches: ['codex/phase06-resumable-r2-v2']
  pull_request:
    paths:
      - 'r2-worker/**'
      - 'r2-resumable-upload.js'
      - 'r2-storage.js'
      - 'cloud-sync.js'
      - '.github/workflows/resumable-uploads-check.yml'
      - 'tests/r2-resumable.spec.cjs'
      - 'tests/helpers/r2-fixture.cjs'
permissions:
  contents: read
concurrency:
  group: resumable-upload-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: r2-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build deployable Worker without contacting production
        run: npx wrangler deploy --dry-run --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: resumable-worker-bundle
          path: r2-worker/dist/
          retention-days: 7
  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VZIP_BENCH_BASE: 0b63d76ba4e6bce0ffbf12ac1ce90700227c3800
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/r2-resumable.spec.cjs tests/r2.spec.cjs --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resumable-browser-failures
          path: test-results/
